<html lang="ko">
<head>
<meta charset="utf-8">

<title>BU2 셋업 보드</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b3fa8'/%3E%3Crect x='10' y='40' width='44' height='6' rx='3' fill='%23ffffff' opacity='.35'/%3E%3Crect x='10' y='40' width='28' height='6' rx='3' fill='%23ffd166'/%3E%3Ctext x='32' y='33' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='22' font-weight='700' fill='%23ffffff'%3EBU2%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1a1d29">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (tabs) + work surface; timelines scroll inside their own frame */
:root{
  /* 기본: 어두운 남색 테마 (BU2 일정 관리와 같은 톤) */
  --bg:#1a1d29; --surface:#22263a; --sunk:#2a2f45; --line:#33394f; --line-soft:#2b3044;
  --fg:#e6e8ef; --muted:#9aa0b4; --faint:#6c7288;
  --accent:#5b8def; --accent-soft:#263457; --accent-fg:#0f1320;
  --ok:#4cc48a; --ok-soft:#1b3a2c; --warn:#e7a03c; --warn-soft:#3d3018; --bad:#f06b6b; --bad-soft:#43222a;
  --c1:#5b8def; --c2:#4cc48a; --c3:#e7a03c; --c4:#a98bf0; --c5:#7f879c; --c6:#3fc1c9;
  --rail:#1e2130;
  --font:"IBM Plex Sans KR",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --line:#d6dce5; --line-soft:#e6eaf0;
  --fg:#18202b; --muted:#5d6878; --faint:#8a94a3;
  --accent:#2350b8; --accent-soft:#e3eafb; --accent-fg:#ffffff;
  --ok:#1f8a55; --ok-soft:#dff3e8; --warn:#b86e00; --warn-soft:#fbefd9; --bad:#c23434; --bad-soft:#f9e1e1;
  --c1:#2350b8; --c2:#1f8a55; --c3:#b86e00; --c4:#7b45b8; --c5:#7a8597; --c6:#0e8a91;
  --rail:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:208px 1fr;min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:9px;background:#3b3fa8;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;box-shadow:inset 0 -5px 0 #ffd166}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.tab{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--sunk);color:var(--fg)}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab .n{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--bad-soft);color:var(--bad);padding:0 6px;border-radius:9px}
.tab svg{width:16px;height:16px;flex:none}
.rail .foot{margin-top:auto;font-size:11px;color:var(--faint);padding:0 10px}
main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.head h1{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.head .sub{color:var(--muted);font-size:13px}
.head .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
a.btn{text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;font-weight:600}
.panel>h2 .sp{flex:1}
.panel .body{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .h{font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{font-size:12px;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--fg)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.done{background:var(--ok)}
/* timeline */
.tl{overflow:auto;max-height:70vh;border-top:1px solid var(--line-soft)}
.tl-in{position:relative}
.tl-row{display:flex;border-bottom:1px solid var(--line-soft);min-height:34px}
.tl-lab{position:sticky;left:0;z-index:2;background:var(--surface);width:220px;flex:none;padding:6px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
.tl-lab .a{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lab .b{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lab.grp{background:var(--sunk);font-weight:700;font-size:12px;letter-spacing:.03em}
.tl-row.grp{background:var(--sunk);min-height:28px}
.tl-row.sub .tl-lab{padding-left:26px}
.tl-row.sub .tl-lab .a{font-weight:500;font-size:12px}
.tl-trk{position:relative;flex:none}
.tl-head{position:sticky;top:0;z-index:3;background:var(--surface)}
.tl-head .tl-lab{z-index:4;font-size:11px;color:var(--muted)}
.hm{display:flex;border-bottom:1px solid var(--line-soft)}
.hm div{font-size:11px;font-weight:600;padding:3px 6px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.hd{display:flex}
.hd div{font-size:10px;text-align:center;color:var(--faint);font-family:var(--mono);border-left:1px solid var(--line-soft);padding:2px 0}
.hd div.we{background:var(--sunk)}
.hd div.td{color:var(--accent);font-weight:700}
.gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.we-bg{position:absolute;top:0;bottom:0;background:var(--sunk);opacity:.55}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:1;pointer-events:none}
.bk{position:absolute;height:20px;border-radius:4px;font-size:11px;line-height:20px;padding:0 6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--c1);border:0;text-align:left;z-index:1}
.bk:hover{filter:brightness(1.08)}
.bk.ghost{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.bk .pf{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.9}
.bk span{position:relative}
.bk.late{background:var(--bad)}
.bk.done{background:var(--ok)}
.bk.todo{background:var(--c5)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px}
.tlbar .rng{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em;background:var(--surface);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:13px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
/* equipment cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.card .ch{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line-soft)}
.card .ch .ti{flex:1;min-width:0}
.card .ch .ti b{display:block;font-size:14px}
.card .ch .ti span{font-size:12px;color:var(--muted)}
.card .pc{font-family:var(--mono);font-size:22px;font-weight:500}
.card .pb{padding:10px 14px 4px}
.chk{display:flex;flex-direction:column;padding:4px 8px 10px}
.chk label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}
.chk label:hover{background:var(--sunk)}
.chk label.d .nm{color:var(--faint);text-decoration:line-through}
.chk .nm{flex:1;min-width:0}
.chk .dt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.chk .dt.late{color:var(--bad);font-weight:600}
.sitehd{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:6px 0 -4px;display:flex;gap:8px;align-items:center}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line-soft);font-size:15px}
.modal form{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld label em{color:var(--bad);font-style:normal}
.fld input,.fld select{width:100%}
.fld input[type=checkbox]{width:auto;flex:none}
.chk1{display:flex!important;gap:8px;align-items:center;font-size:13px!important;color:var(--fg)!important}
.mact{grid-column:1/-1;display:flex;gap:8px;padding-top:4px}
.mact .sp{flex:1}
.items{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:22px minmax(0,1fr) 128px 128px 28px;gap:6px;align-items:center}
.irow input[type=text]{width:100%}
.irow .x{border:0;background:none;cursor:pointer;color:var(--faint);font-size:16px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
.modal.wiz{width:min(720px,100%)}
.wsteps{display:flex;gap:4px;padding:12px 18px 0;overflow-x:auto}
.ws{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;color:var(--faint);font-size:11px;padding:4px 2px}
.ws i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:600;font-family:var(--mono)}
.ws span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ws.on{color:var(--accent);font-weight:600}.ws.on i{background:var(--accent);color:var(--accent-fg)}
.ws.done i{background:var(--ok-soft);color:var(--ok)}
.wbody{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-height:200px}
.wbody h4{margin:0;font-size:15px}
.wbody ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.6}
.wbody code{font-family:var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:12px}
.wbody a.btn{align-self:flex-start;text-decoration:none}
@media (max-width:860px){.ws span{display:none}}
.bk.jira{background:repeating-linear-gradient(135deg,var(--c4) 0 6px,color-mix(in srgb,var(--c4) 78%,#000) 6px 12px)}
.jsw{background:repeating-linear-gradient(135deg,var(--c4) 0 3px,color-mix(in srgb,var(--c4) 70%,#000) 3px 6px)}
.mobnav{display:none}
/* jira block */
.jr{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
.jr:last-child{border-bottom:0}
.jr .k{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;font-weight:500}
.jr .k:hover{text-decoration:underline}
.jr .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr .w{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.jmsg{padding:18px 14px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.jmsg b{color:var(--fg)}
.jstamp{font-size:11px;color:var(--faint);font-weight:400;font-family:var(--mono)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mobnav{display:flex;gap:4px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobnav .tab{padding:6px 10px;white-space:nowrap;font-size:13px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .tl-lab{width:140px}
  .modal form{grid-template-columns:1fr}
  .irow{grid-template-columns:22px minmax(0,1fr) 28px}
  .irow input[type=date]{grid-column:2/3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="탭"></nav>
  <div style="min-width:0">
    <nav class="mobnav" id="mobnav" aria-label="탭"></nav>
    <main><div class="wrap" id="view"></div></main>
  </div>
</div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
// ---------- constants ----------
const TABS=[
  {k:'home',l:'홈',i:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'},
  {k:'people',l:'인원 스케쥴',i:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'},
  {k:'purchase',l:'구매발주현황',i:'<path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>'},
  {k:'trouble',l:'트러블 리스트',i:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'},
  {k:'admin',l:'기준정보',i:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'}
];
const SCH_TYPES=[
  {k:'셋업',c:'var(--c1)'},{k:'현장지원',c:'var(--c6)'},{k:'A/S',c:'var(--c3)'},
  {k:'교육',c:'var(--c4)'},{k:'사무',c:'var(--c5)'},{k:'휴가',c:'var(--c2)'}
];
const FIELD_TYPES=['셋업','현장지원','A/S']; // counted as 출장일
const EQ_STATUS=['대기','진행','완료','보류'];
const TR_STATUS=['접수','진행','모니터링','완료'];
const TR_CAT=['HW','SW','Vision','Motion','Handler','고객요청','기타'];
const TR_PRI=['상','중','하'];

async function api(action,body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,key:API_KEY},body||{}))});

const GAS_CODE="/**\n * BU2 셋업 보드 — Google Apps Script 백엔드\n * - 데이터: 이 스프레드시트의 시트(sites, members, equips, schedules, troubles, config)에 저장\n * - Jira: 스크립트 속성의 Jira API 토큰으로 Jira Cloud REST API를 대신 호출\n *\n * 스크립트 속성 (프로젝트 설정 → 스크립트 속성)\n *   TEAM_KEY    (선택) 팀 접속 키. 넣으면 키를 아는 사람만 읽고 쓸 수 있음\n *   JIRA_SITE   예: https://do-intekplus.atlassian.net\n *   JIRA_EMAIL  Jira 계정 이메일 (API 토큰 발급자)\n *   JIRA_TOKEN  https://id.atlassian.com/manage-profile/security/api-tokens 에서 발급\n */\nvar COLS = ['sites', 'members', 'equips', 'schedules', 'troubles', 'config', 'purchase', 'buylist'];\n\nfunction doGet() {\n  return out_({ ok: true, msg: 'BU2 셋업 보드 서버가 동작 중입니다.' });\n}\n\nfunction doPost(e) {\n  try {\n    var req = JSON.parse(e.postData.contents || '{}');\n    var props = PropertiesService.getScriptProperties();\n    var teamKey = props.getProperty('TEAM_KEY');\n    if (teamKey && req.key !== teamKey) return out_({ ok: false, code: 'auth', error: '팀 접속 키가 맞지 않습니다.' });\n\n    switch (req.action) {\n      case 'load': return out_({ ok: true, data: loadAll_() });\n      case 'save': return out_({ ok: true, id: save_(req.col, req.id, req.data) });\n      case 'delete': remove_(req.col, req.id); return out_({ ok: true });\n      case 'buySheetRead': return out_(buySheetRead_(req.src));\n      case 'buySheetCreate': return out_(buySheetCreate_(req.rows));\n      case 'replaceCol': return out_({ ok: true, count: replaceCol_(req.col, req.rows) });\n      case 'jiraSearch': return out_(jiraSearch_(req.jql, req.max));\n      case 'jiraUser': return out_(jiraUser_(req.query));\n      case 'jiraFields': return out_(jiraFields_(req.project));\n      case 'jiraTrips': return out_(jiraTrips_(req));\n      case 'jiraUpdateTrip': return out_(jiraUpdateTrip_(req));\n      case 'jiraCreateMeta': return out_(jiraCreateMeta_(req.project, req.typeId));\n      case 'jiraCreateIssue': return out_(jiraCreateIssue_(req));\n      case 'jiraEditIssue': return out_(jiraEditIssue_(req));\n      case 'jiraIssues': return out_(jiraIssues_(req));\n      case 'teamsGet': return out_(teamsGet_());\n      case 'teamsSave': return out_(teamsSave_(req));\n      case 'teamsTest': return out_(teamsTest_());\n      case 'teamsRun': return out_(dueCheck_(true));\n      default: return out_({ ok: false, code: 'bad_request', error: '알 수 없는 요청: ' + req.action });\n    }\n  } catch (err) {\n    return out_({ ok: false, code: 'server', error: String(err && err.message || err) });\n  }\n}\n\nfunction out_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n\n// ---------- 데이터 ----------\nfunction sheet_(col) {\n  if (COLS.indexOf(col) < 0) throw new Error('허용되지 않은 컬렉션: ' + col);\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sh = ss.getSheetByName(col);\n  if (!sh) {\n    sh = ss.insertSheet(col);\n    sh.getRange(1, 1, 1, 3).setValues([['id', 'json', 'updated']]);\n    sh.setFrozenRows(1);\n  }\n  return sh;\n}\n\nfunction rows_(col) {\n  var sh = sheet_(col);\n  var n = sh.getLastRow() - 1;\n  if (n < 1) return [];\n  return sh.getRange(2, 1, n, 2).getValues();\n}\n\nfunction loadAll_() {\n  var data = {};\n  COLS.forEach(function (c) {\n    data[c] = rows_(c).filter(function (r) { return r[0]; }).map(function (r) {\n      var o = {};\n      try { o = JSON.parse(r[1]); } catch (e) {}\n      o.id = String(r[0]);\n      return o;\n    });\n  });\n  return data;\n}\n\nfunction save_(col, id, data) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var sh = sheet_(col);\n    if (!id) id = Utilities.getUuid().replace(/-/g, '').slice(0, 20);\n    if (data && data.id) delete data.id;\n    var json = JSON.stringify(data || {});\n    var now = new Date();\n    var rows = rows_(col);\n    for (var i = 0; i < rows.length; i++) {\n      if (String(rows[i][0]) === String(id)) {\n        sh.getRange(i + 2, 2, 1, 2).setValues([[json, now]]);\n        return id;\n      }\n    }\n    sh.appendRow([id, json, now]);\n    return id;\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n\n// ---------- 구매 LIST 구글 시트 ----------\nvar BUY_HEAD_ = ['납품처/고객사', '문서번호', '구매\\n담당자', '설비', '품목', '예정일', '비고 1', '비고 2', '진행 사항', '담당자', '현황', '', '', '', '납품현황'];\nvar BUY_KEYS_ = ['cust', 'doc', 'buyer', 'equip', 'item', 'plan', 'note1', 'note2', 'progress', 'owner', 'status', '', '', '', 'deliv'];\nfunction sheetId_(src) {\n  var s = String(src || '').trim();\n  var m = /\\/d\\/([a-zA-Z0-9_-]{20,})/.exec(s);\n  if (m) return m[1];\n  if (/^[a-zA-Z0-9_-]{20,}$/.test(s)) return s;\n  return '';\n}\n/** 구매 LIST 구글 시트를 읽어 2차원 값으로 돌려줌 (머리글 행 자동 탐색은 화면 쪽에서) */\nfunction buySheetRead_(src) {\n  var id = sheetId_(src);\n  if (!id) return { ok: false, code: 'bad_request', error: '구글 시트 주소가 올바르지 않습니다.' };\n  var ss;\n  try { ss = SpreadsheetApp.openById(id); } catch (e) { return { ok: false, code: 'no_access', error: '시트를 열 수 없습니다. Apps Script를 만든 구글 계정에 그 시트 보기 권한이 있는지 확인하세요. (' + e.message + ')' }; }\n  var sheets = ss.getSheets().map(function (sh) {\n    var r = sh.getLastRow(), c = sh.getLastColumn();\n    return { name: sh.getName(), rows: r && c ? sh.getRange(1, 1, r, Math.min(c, 30)).getDisplayValues() : [] };\n  });\n  return { ok: true, id: id, url: ss.getUrl(), title: ss.getName(), sheets: sheets };\n}\n/** 보드의 구매 LIST로 새 구글 시트를 만듦 (원래 엑셀과 같은 열 순서) */\nfunction buySheetCreate_(rows) {\n  rows = rows || [];\n  var ss = SpreadsheetApp.create('BU2 구매 LIST');\n  var sh = ss.getSheets()[0]; sh.setName('구매리스트');\n  var data = [BUY_HEAD_].concat(rows.map(function (r) { return BUY_KEYS_.map(function (k) { return k ? (r[k] == null ? '' : String(r[k])) : ''; }); }));\n  sh.getRange(1, 1, data.length, BUY_HEAD_.length).setNumberFormat('@').setValues(data).setWrap(true).setVerticalAlignment('top');\n  sh.getRange(1, 1, 1, BUY_HEAD_.length).setFontWeight('bold').setBackground('#3b3fa8').setFontColor('#ffffff').setHorizontalAlignment('center');\n  for (var i = 1; i <= data.length; i++) sh.getRange(i, 11, 1, 4).merge();\n  [19.5, 25.6, 8.3, 12.3, 42.8, 15.6, 23.3, 61.5, 50.9, 11.6, 9, 13, 13, 6.8, 13].forEach(function (w, i) { sh.setColumnWidth(i + 1, Math.round(w * 7.5)); });\n  sh.setFrozenRows(1);\n  return { ok: true, id: ss.getId(), url: ss.getUrl(), title: ss.getName() };\n}\n\n/** 한 컬렉션 전체를 새 행 목록으로 바꿈 (구매발주 현황 엑셀 업로드용) */\nfunction replaceCol_(col, rows) {\n  if (['purchase', 'buylist'].indexOf(col) < 0) throw new Error('바꿀 수 없는 컬렉션: ' + col);\n  rows = (rows || []).slice(0, 3000);\n  var lock = LockService.getScriptLock();\n  lock.waitLock(30000);\n  try {\n    var sh = sheet_(col);\n    var last = sh.getLastRow();\n    if (last > 1) sh.getRange(2, 1, last - 1, 3).clearContent();\n    if (rows.length) {\n      var now = new Date();\n      sh.getRange(2, 1, rows.length, 3).setValues(rows.map(function (r, i) { var o = {}; Object.keys(r || {}).forEach(function (k) { if (k !== 'id') o[k] = r[k]; }); return ['p' + i, JSON.stringify(o), now]; }));\n    }\n    return rows.length;\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction remove_(col, id) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var sh = sheet_(col);\n    var rows = rows_(col);\n    for (var i = rows.length - 1; i >= 0; i--) {\n      if (String(rows[i][0]) === String(id)) sh.deleteRow(i + 2);\n    }\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n// ---------- Jira ----------\nfunction jiraConf_() {\n  var p = PropertiesService.getScriptProperties();\n  var site = (p.getProperty('JIRA_SITE') || '').replace(/\\/+$/, '');\n  var email = p.getProperty('JIRA_EMAIL');\n  var token = p.getProperty('JIRA_TOKEN');\n  if (!site || !email || !token) return null;\n  if (!/^https?:\\/\\//.test(site)) site = 'https://' + site;\n  return { site: site, auth: 'Basic ' + Utilities.base64Encode(email + ':' + token) };\n}\n\nfunction jiraFetch_(conf, path, opt) {\n  opt = opt || {};\n  var res = UrlFetchApp.fetch(conf.site + path, {\n    method: o // ---------- TIMELINE ----------
const ZOOM={week:{w:30,days:42,step:7},month:{w:11,days:120,step:30}};
function tlStart(key){if(!ui[key]){const t=today();ui[key]=addD(t,-((t.getDay()+6)%7)-7)}return ui[key]}
function lanes(bars){const ends=[];for(const b of bars.sort((a,c)=>a.s-c.s)){let l=ends.findIndex(e=>e<b.s);if(l<0){l=ends.length;ends.push(0)}ends[l]=b.f;b.lane=l}return Math.max(1,ends.length)}
function timeline(rows,zoomKey,startKey){
  const z=ZOOM[ui[zoomKey]],st=tlStart(startKey),W=z.w*z.days,t=today();
  let hm='',hd='',bg='';
  let cur=null,cs=0;
  for(let i=0;i<=z.days;i++){
    const d=addD(st,i),k=d.getFullYear()+'.'+(d.getMonth()+1);
    if(k!==cur||i===z.days){if(cur)hm+=`<div style="width:${(i-cs)*z.w}px">${cur}</div>`;cur=k;cs=i}
    if(i===z.days)break;
    const we=d.getDay()===0||d.getDay()===6,td=+d===+t;
    if(ui[zoomKey]==='week')hd+=`<div class="${we?'we':''}${td?' td':''}" style="width:${z.w}px">${d.getDate()}<br>${DOW[d.getDay()]}</div>`;
    else if(d.getDay()===1)hd+=`<div style="position:absolute;left:${i*z.w}px;width:${7*z.w}px;text-align:left;padding-left:3px">${d.getDate()}</div>`;
    if(we&&ui[zoomKey]==='week')bg+=`<div class="we-bg" style="left:${i*z.w}px;width:${z.w}px"></div>`;
    if(d.getDay()===1)bg+=`<div class="gl" style="left:${i*z.w}px"></div>`;
  }
  const ti=diff(st,t);const tdl=ti>=0&&ti<z.days?`<div class="today" style="left:${ti*z.w+z.w/2}px"></div>`:'';
  let h=`<div class="tl"><div class="tl-in" style="width:${220+W}px">`;
  h+=`<div class="tl-row tl-head"><div class="tl-lab">${ui[zoomKey]==='week'?'일 단위':'주 단위 (월요일)'}</div><div class="tl-trk" style="width:${W}px"><div class="hm">${hm}</div><div class="hd" style="position:relative;${ui[zoomKey]==='month'?'height:18px':''}">${hd}</div></div></div>`;
  for(const r of rows){
    if(r.group){h+=`<div class="tl-row grp"><div class="tl-lab grp">${esc(r.group)}</div><div class="tl-trk" style="width:${W}px"></div></div>`;continue}
    const bars=(r.bars||[]).filter(b=>b.s);
    const n=lanes(bars);const H=Math.max(34,n*24+8);
    let bh='';
    for(const b of bars){
      let a=diff(st,b.s),e=diff(st,b.f||b.s)+1;
      if(e<=0||a>=z.days)continue;a=Math.max(a,0);e=Math.min(e,z.days);
      const w=Math.max((e-a)*z.w-2,6);
      bh+=`<button class="bk ${b.cls||''}" style="left:${a*z.w+1}px;width:${w}px;top:${6+b.lane*24}px;${b.color?'background:'+b.color:''}" title="${esc(b.tip||b.label)}" data-act="${b.act}" data-id="${b.id||''}" data-sub="${b.sub||''}">${b.pct!=null?`<i class="pf" style="width:${b.pct}%"></i>`:''}<span>${esc(b.label||'')}</span></button>`;
    }
    h+=`<div class="tl-row ${r.cls||''}" style="min-height:${H}px"><div class="tl-lab" ${r.act?`data-act="${r.act}" data-id="${r.id}" style="cursor:pointer"`:''}><span class="a">${r.lab}</span>${r.sub?`<span class="b">${r.sub}</span>`:''}</div><div class="tl-trk" style="width:${W}px">${bg}${tdl}${bh}</div></div>`;
  }
  if(!rows.length)h+=`<div class="empty" style="position:sticky;left:0;width:min(100%,600px)">표시할 항목이 없습니다.</div>`;
  h+=`</div></div>`;
  return h;
}
function tlBar(zoomKey,startKey,extra){
  const z=ZOOM[ui[zoomKey]],st=tlStart(startKey),en=addD(st,z.days-1);
  return `<div class="tlbar"><div class="seg"><button class="${ui[zoomKey]==='week'?'on':''}" data-act="zoom" data-k="${zoomKey}" data-v="week">일</button><button class="${ui[zoomKey]==='month'?'on':''}" data-act="zoom" data-k="${zoomKey}" data-v="month">월</button></div>
  <button class="btn sm" data-act="shift" data-k="${startKey}" data-z="${zoomKey}" data-d="-1" aria-label="이전">◀</button><button class="btn sm" data-act="shift" data-k="${startKey}" data-z="${zoomKey}" data-d="0">오늘</button><button class="btn sm" data-act="shift" data-k="${startKey}" data-z="${zoomKey}" data-d="1" aria-label="다음">▶</button>
  <span class="rng">${fd(st)} ~ ${fd(en)}</span><span style="flex:1"></span>${extra||''}</div>`;
}

function vGantt(){

  if(nb)return h+nb;
  const rows=[];
  const sites=[...S.sites].sort(byName);
  const showDone=ui.gDone;
  for(const s of sites){
    const eqs=S.equips.filter(e=>e.site===s.id&&(showDone||e.status!=='완료')).sort((a,b)=>String(a.model+a.unit).localeCompare(String(b.model+b.unit)));
    if(!eqs.length)continue;
    rows.push({group:(s.customer?s.customer+' · ':'')+s.name});
    for(const e of eqs){
      const rg=eqRange(e),p=eqProg(e),open=ui.open[e.id];
      const late=(e.items||[]).some(itemLate);
      rows.push({lab:`${open?'▾':'▸'} ${esc(equipName(e.id))}`,sub:`${esc(memberName(e.owner))} · ${p}% · ${esc(e.status||'')}`,act:'toggleEq',id:e.id,
        bars:rg?[{s:rg.s,f:rg.f,label:`${equipName(e.id)} ${p}%`,pct:p,cls:'ghost'+(late?' ':''),act:'editEq',id:e.id,tip:`${equipName(e.id)} ${fd(rg.s)}~${fd(rg.f)} 진행 ${p}%`}]:[]});
      if(open)for(const it of (e.items||[])){
        const a=pd(it.start),b=pd(it.end)||a;
        rows.push({cls:'sub',lab:`${it.done?'✓ ':''}${esc(it.name)}`,sub:it.start?`${short(it.start)}~${short(it.end||it.start)}`:'일정 미입력',
          bars:a?[{s:a,f:b,label:it.name,cls:it.done?'done':itemLate(it)?'late':'todo',act:'toggleItem',id:e.id,sub:it.id,tip:`${it.name} ${it.start}~${it.end||it.start} ${it.done?'완료':'클릭하면 완료 처리'}`}]:[]});
      }
    }
  }
  h+=`<div class="panel">${tlBar('gZoom','gStart',`<label class="muted" style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="gDone" data-act="gDone" ${showDone?'checked':''}>완료 설비 보기</label><button class="btn sm" data-act="expandAll">모두 펼치기</button><button class="btn sm" data-act="collapseAll">모두 접기</button>`)}
  ${timeline(rows,'gZoom','gStart')}
  <div class="tlbar legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>설비 전체 일정 (채움 = 진행율)</span><span><i style="background:var(--c5)"></i>예정</span><span><i style="background:var(--ok)"></i>완료</span><span><i style="background:var(--bad)"></i>지연</span><span>설비명을 누르면 항목이 펼쳐지고, 항목 막대를 누르면 완료/미완료가 바뀝니다.</span></div></div>`;
  return h;
}

  h+=`<div class="panel">${tlBar('pZoom','pStart',sel+jt)}${timeline(rows,'pZoom','pStart')}<div class="tlbar legend">${SCH_TYPES.map(x=>`<span><i style="background:${x.c}"></i>${x.k}</span>`).join('')}<span><i class="jsw"></i>Jira 출장 (BT)</span><span>Jira 막대를 누르면 출장 일정을 바꿀 수 있습니다.</span></div></div>`;
  const months=[];for(let i=5;i>=0;i--)months.push(new Date(t.getFullYear(),t.getMonth()-i,1));
  months.push(new Date(t.getFullYear(),t.getMonth()+1,1));
  h+=`<div class="panel"><h2>월별 현장 투입일<span class="muted" style="font-weight:400;font-size:12px">셋업·현장지원·A/S${jOn?'·Jira 출장':''} 일수 (주말 포함, 겹치는 날은 1일)</span></h2><div class="tw"><table><thead><tr><th>이름</th>${months.map(m=>`<th class="num">${m.getFullYear()%100}.${m.getMonth()+1}</th>`).join('')}<th class="num">합계</th></tr></thead><tbody>${people.map(p=>{
    const list=(p.m?S.schedules.filter(s=>s.member===p.m.id):[]).concat(jOn?p.trips:[]);let tot=0;
    const cells=months.map(mo=>{const v=fieldDays(list,mo,new Date(mo.getFullYear(),mo.getMonth()+1,0));tot+=v;return `<td class="num">${v||'<span class="muted">·</span>'}</td>`}).join('');
    return `<tr><td>${esc(p.name)}</td>${cells}<td class="num"><b>${tot}</b></td></tr>`}).join('')}</tbody></table></div></div>`;

}
function fieldDays(list,a,b){const set=new Set();for(const s of list){if(!(s.jira||FIELD_TYPES.includes(s.type)))continue;let x=pd(s.start),y=pd(s.end)||x;if(!x)continue;if(x<a)x=a;if(y>b)y=b;for(let d=x;d<=y;d=addD(d,1))set.add(+d)}return set.size}
// 인원 행 = 기준정보 인원 + BT 보드 담당자(이름 기준). 계정번호 → 이름 순으로 매칭
function normName(s){return String(s||'').replace(/\s+/g,'').replace(/\(.*?\)/g,'').toLowerCase()}
function peopleRows(){
  const mem=[...S.members].sort((a,b)=>(a.order||0)-(b.order||0)||byName(a,b));
  const rows=mem.map(m=>({name:m.name,m,trips:[]}));
  const trips=ui.showJira===false?[]:BT.trips;
  const add=(r,x)=>{if(!r.trips.includes(x))r.trips.push(x)};
  for(const x of trips){
    let hit=false;
    // 1) 제목에 적힌 출장자 이름
    for(const n of (x.travelers||[])){
      let r=rows.find(r=>r.m&&normName(r.m.name)===normName(n));
      if(!r&&JC.btAll){r=rows.find(r=>!r.m&&r.key==='n:'+n);if(!r){r={name:n,m:null,key:'n:'+n,trips:[]};rows.push(r)}}
      if(r){add(r,x);hit=true}
    }
    // 2) 담당자 (제목에 이름이 없을 때)
    if(!(x.travelers||[]).length){
      let r=rows.find(r=>r.m&&x.personId&&jiraAcc(r.m)===x.personId)
        ||rows.find(r=>r.m&&normName(r.m.name)&&(normName(x.person).includes(normName(r.m.name))||normName(r.m.jiraName)===normName(x.person)));
      if(!r&&JC.btAll){r=rows.find(r=>!r.m&&r.key===(x.personId||x.person));if(!r){r={name:x.person||'(담당자 없음)',m:null,key:x.personId||x.person,trips:[]};rows.push(r)}}
      if(r){add(r,x);hit=true}
    }
  }
  let out=JC.btAll?rows:rows.filter(r=>r.m);
  if(ui.btOnly)out=out.filter(r=>r.trips.length);
  return out;
}

function field(f,v){
  const req=f.req?'<em>*</em>':'',id='f_'+f.k;
  let inp;
  if(f.t==='select')inp=`<select id="${id}" name="${f.k}" ${f.req?'required':''}>${opts(f.o,v,f.ph)}</select>`;
  else if(f.t==='area')inp=`<textarea id="${id}" name="${f.k}">${esc(v||'')}</textarea>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v??'')}" ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<div class="fld ${f.full?'full':''}"><label for="${id}">${f.l}${req}</label>${inp}</div>`;
}
function openModal(title,fields,data,col,extraHtml){

let armT=null;
async function act(a,d,ev,el){
  const get=(c,id)=>S[c].find(x=>x.id===id);
  switch(a){
    case 'zoom':ui[d.k]=d.v;render();break;
    case 'shift':{const k=d.k,z=ZOOM[ui[d.z]];if(d.d==='0'){ui[k]=null}else ui[k]=addD(tlStart(k),Number(d.d)*z.step*(ui[d.z]==='week'?1:1));render();break}
    case 'toggleEq':ui.open[d.id]=!ui.open[d.id];render();break;
    case 'expandAll':S.equips.forEach(e=>ui.open[e.id]=true);render();break;
    case 'collapseAll':ui.open={};render();break;
    case 'gDone':ui.gDone=el.checked;render();break;
    case 'prDone':ui.prDone=el.checked;render();break;
    case 'toggleItem':case 'chkItem':{
      if(!canWrite)return;
      const e=get('equips',d.id);if(!e)return;
      const items=(e.items||[]).map(i=>i.id===d.sub?Object.assign({},i,{done:!i.done}):i);
      const o=strip(e);o.items=items;if(items.length&&items.every(i=>i.done))o.status='완료';else if(items.some(i=>i.done)&&o.status==='대기')o.status='진행';
      await save('equips',e.id,o);break}
    case 'newSite':openModal('사이트 등록',F.site,null,'sites');break;
    case 'editSite':openModal('사이트 수정',F.site,get('sites',d.id),'sites');break;
    case 'newMem':openModal('인원 등록',F.mem,null,'members');break;
    case 'editMem':openModal('인원 수정',F.mem,get('members',d.id),'members');break;

let JC={};

const isAcc=v=>/^[0-9a-f]{24}$/i.test(v)||/^\d+:[0-9a-f-]{16,}$/i.test(v);
function jiraAcc(m){const v=String(m.jira||'').trim();if(!v)return null;if(isAcc(v))return v;if(m.jiraId&&m.jiraSrc===v)return m.jiraId;return null}
function jiraJql(){
  if(String(JC.jql||'').trim())return String(JC.jql).trim();
  const ids=S.members.map(jiraAcc).filter(Boolean);
  if(!ids.length)return null;
  const list=ids.map(i=>'"'+i+'"').join(',');
  const days=Math.max(1,Math.min(180,Number(JC.days)||14));
  const proj=String(JC.project||'').split(/[,\s]+/).filter(Boolean).map(p=>'"'+p.replace(/"/g,'')+'"');
  return `(creator in (${list}) OR reporter in (${list}) OR assignee in (${list})) AND updated >= -${days}d${proj.length?` AND project in (${proj.join(',')})`:''} ORDER BY updated DESC`;
}
function jiraEnsure(force){
  if(dbState!=='on'||!JC._loaded)return;
  const q=jiraJql();
  if(!q){clearInterval(J.timer);J.key='';J.state='nopeople';render();return}
  if(q===J.key&&!force)return;
  J.key=q;clearInterval(J.timer);
  if(J.state!=='ok')J.state='loading';render();

  J.timer=setInterval(()=>{if(!document.hidden&&!J.busy&&(!J.at||Date.now()-J.at>=6*3600e3))jiraFetch()},600000);
}
async function jiraFetch(){

  catch(e){if(J.state==='ok'&&!/^jira_(config|http|auth)$/.test(e.code)){J.err=e}else{J.state='error';J.err=e;J.issues=[]}}

}

  const dateCond=JC.btEnd&&JC.btEnd!==JC.btStart?`(${E_} >= "${from}" OR ${S_} >= "${from}")`:`${S_} >= "${from}"`;
  return `project = "${p}"${who} AND ${dateCond} ORDER BY ${S_} DESC`;
}
// BT 제목 형식: 최초/2026-10-19(월)~2026-10-23(금)/구미/LGIT/맹준영,한민철
const BT_RANGE=/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})(\s*\([^)]*\))?\s*[~∼～]\s*(?:(\d{4})[-.\/])?(\d{1,2})[-.\/](\d{1,2})(\s*\([^)]*\))?/;
const p2=n=>String(n).padStart(2,'0');
function parseBTTitle(t){
  const out={};const m=BT_RANGE.exec(t||'');
  if(m){out.start=`${m[1]}-${p2(m[2])}-${p2(m[3])}`;out.end=`${m[5]||m[1]}-${p2(m[6])}-${p2(m[7])}`;if(out.end<out.start&&!m[5])out.end=`${+m[1]+1}-${p2(m[6])}-${p2(m[7])}`}
  const parts=String(t||'').split('/').map(x=>x.trim());
  let i=parts.findIndex(x=>BT_RANGE.test(x)||/\d{4}-\d{1,2}-\d{1,2}/.test(x));
  if(i>=0){
    const rest=parts.slice(i+1);
    const names=[];const place=[];
    rest.forEach((x,j)=>{const toks=x.split(/[,，、·\s]+/).filter(Boolean);
      if(j>=rest.length-1||toks.every(k=>/^[가-힣]{2,4}$/.test(k))&&toks.length>1)toks.forEach(k=>{if(/^[가-힣A-Za-z]{2,10}$/.test(k))names.push(k)});else place.push(x)});
    out.place=place.filter(Boolean).reverse().join(' ');out.names=names;
  }
  return out;
}
function enrichTrip(x){
  const t=parseBTTitle(x.summary);
  const endFieldSet=!!(JC.btEnd&&JC.btEnd!==JC.btStart);
  if(!x.start&&t.start)x.start=t.start;
  if(t.end&&(!endFieldSet||!x.end)){x.end=t.end;x.endFromTitle=true}
  if(!x.site&&t.place)x.site=t.place;
  x.travelers=t.names||[];x.titleRange=!!t.start;
  return x;
}

  if(!q){clearInterval(BT.timer);BT.key='';BT.state='nocfg';render();return}

  btFetch();BT.timer=setInterval(()=>{if(!document.hidden)btFetch()},300000);
}

async function trAct(a,d,el){
  if(a==='trMeta'){
    const p=($('#trj_proj').value||'').trim().toUpperCase();if(!p){toast('프로젝트 키를 넣어 주세요');return}
    TRJ.busy=true;render();

    catch(e){toast(e.code==='jira_auth'?'Jira 로그인 실패 (API 토큰 확인)':'불러오지 못했습니다: '+(e.message||''))}
    TRJ.busy=false;render();return}
  if(a==='trJiraSave'){
    const v=id=>($('#'+id)||{}).value||'';
    const o=Object.assign(strip(JC),{trOn:!!($('#trj_on')||{}).checked,trProject:v('trj_proj').trim().toUpperCase(),trPrefix:v('trj_prefix'),updated:new Date().toISOString()});delete o._loaded;

    if(TRJ.meta){
      if(TRJ.meta.type&&TRJ.meta.type.id!==o.trTypeId){toast('이슈 유형을 바꿨다면 [이슈 유형·필드 불러오기]를 다시 눌러 필수 항목을 확인하세요')}
      const pm={};['상','중','하'].forEach(k=>{const s=$('#trp_'+k);if(s&&s.value)pm[k]=s.value});o.trPri=pm;
      const dv={};let miss=[];
      document.querySelectorAll('#trjform [data-fid]').forEach(el=>{const f=el.dataset.fid,k=el.dataset.kind,val=el.value.trim();
        if(!val){miss.push((TRJ.meta.fields.find(x=>x.id===f)||{}).name||f);return}
        dv[f]=k==='opt'?{id:val}:k==='arr'?[{id:val}]:k==='num'?Number(val):k==='user'?{accountId:val}:k==='strarr'?[val]:val});
      o.trDefaults=dv;
      if(o.trOn&&miss.length){toast('필수 항목을 채워 주세요: '+miss.join(', '));return}
    }
    if(o.trOn&&(!o.trProject||!o.trTypeId)){toast('프로젝트 키를 넣고 [이슈 유형·필드 불러오기]를 먼저 눌러 주세요');return}
    if(await saveConfig(o))toast(o.trOn?'트러블 Jira 연동을 켰습니다':'설정을 저장했습니다');
    return}
  if(a==='trJiraSend'){el.disabled=true;el.textContent='등록 중…';await trSyncJira(d.id);closeModal();return}
}

// ---------- 트러블 리스트: Jira Issue&VOC 불러오기 ----------
const TJ={state:'init',issues:[],at:null,err:null,busy:false,timer:null,key:''};
function tjJql(){
  if(String(JC.tjJql||'').trim())return String(JC.tjJql).trim();
  const ids=S.members.map(jiraAcc).filter(Boolean);
  if(!ids.length)return null;
  const list=ids.map(i=>'"'+i+'"').join(',');
  const type=String(JC.tjType||'Issue&VOC').replace(/"/g,'');
  const days=Math.max(7,Math.min(730,Number(JC.tjDays)||90));
  const proj=String(JC.tjProject||'').split(/[,\s]+/).filter(Boolean).map(p=>'"'+p.replace(/"/g,'')+'"');
  return `issuetype = "${type}" AND (reporter in (${list}) OR assignee in (${list}) OR creator in (${list})) AND (created >= -${days}d OR statusCategory != Done)${proj.length?` AND project in (${proj.join(',')})`:''} ORDER BY created DESC`;
}
function tjEnsure(force){
  if(dbState!=='on'||!JC._loaded)return;
  if(JC.tjOff){clearInterval(TJ.timer);TJ.key='';TJ.state='off';TJ.issues=[];return}
  const q=tjJql();
  if(!q){clearInterval(TJ.timer);TJ.key='';TJ.state='nopeople';render();return}
  if(q===TJ.key&&!force)return;
  TJ.key=q;clearInterval(TJ.timer);if(TJ.state!=='ok')TJ.state='loading';
  tjFetch();TJ.timer=setInterval(()=>{if(!document.hidden)tjFetch()},300000);
}
async function tjFetch(){
  if(!TJ.key)return;TJ.busy=true;render();
  try{const j=await api('jiraIssues',{jql:TJ.key});if(j.site)J.site=j.site;TJ.issues=j.issues||[];TJ.state='ok';TJ.err=null;TJ.at=Date.now()}
  catch(e){if(TJ.state==='ok'&&!/^jira_(config|http|auth)$/.test(e.code))TJ.err=e;else{TJ.state='error';TJ.err=e;TJ.issues=[]}}
  TJ.busy=false;render();
}
const JST={new:'접수',indeterminate:'진행',done:'완료'};
function jPriCls(p){return /highest|high|^a$|긴급|최상|상|critical|blocker/i.test(p||'')?'bad':/medium|^b$|중|major/i.test(p||'')?'warn':''}
// 보드 트러블 + Jira 이슈를 한 목록으로
function trRows(){
  const t=today(),rows=[];
  for(const x of S.troubles){const d=pd(x.date);
    rows.push({src:'board',id:x.id,no:x.no,key:x.jiraKey||'',date:x.date||'',pri:x.pri||'-',priCls:x.pri==='상'?'bad':x.pri==='중'?'warn':'',status:x.status,open:x.status!=='완료',
      where:siteName(x.site),sub2:equipName(x.equip),cat:x.cat||'',title:x.title,note:x.action?'조치: '+x.action:'',owner:memberName(x.owner),ownerIds:[x.owner],
      age:d?diff(d,x.status==='완료'&&pd(x.closed)?pd(x.closed):t):'',closed:x.closed||'',raw:x,site:x.site})}
  if(!JC.tjOff)for(const x of TJ.issues){
    if(S.troubles.some(b=>b.jiraKey===x.key))continue; // 보드에서 만든 이슈는 보드 행으로만
    const c=String(x.created).slice(0,10),r=String(x.resolved||'').slice(0,10),d=pd(c);
    const mem=S.members.filter(m=>{const a=jiraAcc(m);return a&&((x.assignee&&x.assignee.id===a)||(x.reporter&&x.reporter.id===a))}).map(m=>m.id);
    rows.push({src:'jira',id:x.key,no:'',key:x.key,date:c,pri:x.priority||'-',priCls:jPriCls(x.priority),status:x.status,mapped:JST[x.cat]||'진행',open:x.cat!=='done',
      where:x.project,sub2:'',cat:x.type,title:x.summary,note:x.reporter?'작성: '+x.reporter.name:'',owner:x.assignee?x.assignee.name:'미지정',ownerIds:mem,
      age:d?diff(d,r&&pd(r)?pd(r):t):'',closed:r,raw:x});
  }
  return rows;
}
function trOpenCount(){return trRows().filter(r=>r.open).length}
function trFiltered(){
  const f=ui.trF,q=f.q.trim().toLowerCase();
  const site=S.sites.find(s=>s.id===f.site);
  return trRows().filter(r=>{
    if(f.src&&r.src!==f.src)return false;
    if(f.site){if(r.src==='board'){if(r.site!==f.site)return false}else{const k=[site&&site.name,site&&site.customer].filter(Boolean).map(s=>s.toLowerCase());if(!k.some(s=>r.title.toLowerCase().includes(s)))return false}}
    if(f.cat&&r.cat!==f.cat)return false;
    if(f.who&&!r.ownerIds.includes(f.who))return false;
    const st=r.src==='board'?r.status:r.mapped;
    if(f.status==='open'&&!r.open)return false;
    if(f.status!=='open'&&f.status!=='all'&&st!==f.status)return false;
    if(q&&![r.title,r.note,r.owner,r.key,r.where,r.raw.symptom,r.raw.cause,r.raw.action].join(' ').toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.no||0)-(a.no||0));
}

  if(JC.tjOff)return '';

  if(TJ.state==='loading'||TJ.state==='init')return `<span class="muted" style="font-size:12px">Jira 불러오는 중…</span>`;

const PUR_COLS=[['recvDate',/입고\s*일자|^입고\s*일$/],['due',/납기|입고\s*예정|납품\s*예정|예정\s*일/],['odate',/발주\s*일/],['remain',/미입고|잔량|잔여/],['recv',/입고\s*(수량|량)|^입고$/],['qty',/발주\s*수량|^수량$|수량/],['po',/발주\s*번호|po\s*no|^po$/i],['pname',/프로젝트\s*명|과제\s*명/],['project',/프로젝트|project|비고\s*1|과제\s*코드|^코드$/i],['item',/품목\s*명|품명|품목|item/i],['spec',/규격|사양|spec/i],['vendor',/거래처|업체|공급사|vendor/i],['status',/상태|판정|진행/],['row',/엑셀\s*행|^행$/],['note',/비고|메모|사유|note|확인/i]];

function xlDate(v){
  if(v==null||v==='')return '';

  const s=String(v).trim();let m=/(\d{4})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/.exec(s);if(m)return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  m=/^(\d{1,2})[/.-](\d{1,2})$/.exec(s);if(m)return `${today().getFullYear()}-${p2(m[1])}-${p2(m[2])}`;

const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(/[,\s]/g,''));return isFinite(n)?n:null};
function parseWorkbook(XL,wb){
  const sheets=wb.SheetNames.map(name=>{
    const rows=XL.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
    let hi=-1,map=null,best=0;
    for(let i=0;i<Math.min(15,rows.length);i++){const m=mapHeader(rows[i]);const n=Object.keys(m).length;if(n>best&&n>=2){best=n;hi=i;map=m}}
    if(hi<0)return {name,lines:[]};
    const lines=rows.slice(hi+1).map(r=>{const o={};Object.keys(map).forEach(i=>{const v=r[i];if(v!==''&&v!=null)o[map[i]]=v});return o}).filter(o=>Object.keys(o).length>=2);
    return {name,lines,cols:Object.values(map)};
  });
  const note=sheets.find(s=>/확인/.test(s.name)&&s.lines.length);
  const data=sheets.filter(s=>s!==note&&s.cols&&(s.cols.includes('po')||s.cols.includes('item')));
  const main=data.find(s=>/전체/.test(s.name))||data.sort((a,b)=>b.lines.length-a.lines.length)[0];
  if(!main)throw new Error('발주번호나 품목 열을 찾지 못했습니다. CamSetup590에서 내보낸 엑셀이나 ERP 구매발주진행현황 엑셀인지 확인하세요.');
  const norm=o=>{
    const x={kind:'line',project:String(o.project||'').trim(),pname:String(o.pname||'').trim(),item:String(o.item||'').trim(),spec:String(o.spec||'').trim(),po:String(o.po||'').trim(),vendor:String(o.vendor||'').trim(),

    if(x.remain==null&&x.qty!=null&&x.recv!=null)x.remain=Math.max(0,x.qty-x.recv);
    return x;
  };
  const lines=main.lines.map(norm).filter(x=>x.po||x.item);
  const notes=note?note.lines.map(o=>Object.assign(norm(o),{kind:'note'})):[];

}
function purState(x){
  const t=fd(today()),soon=fd(addD(today(),7));

function purProjects(lines){
  const m=new Map();
  for(const x of lines){const k=x.project||'(코드 없음)';if(!m.has(k))m.set(k,{project:k,pname:x.pname,rows:new Set(),n:0,done:0,open:0,late:0,soon:0,cancel:0,dues:[]});
    const p=m.get(k);p.n++;if(x.row)p.rows.add(x.row);if(!p.pname&&x.pname)p.pname=x.pname;

const CODE_RE=/\b(ZSP[A-Z0-9]{7}|IP[0-9A-Z]{8}(?:-[IO])?)\b/g;
function buyCodes(r){const s=[r.note1,r.note2,r.progress].join(' ').toUpperCase();return [...new Set((s.match(CODE_RE)||[]))]}
const baseCode=c=>String(c||'').toUpperCase().replace(/-[IO]$/,'').trim();

function buyErp(r){
  const codes=buyCodes(r);if(!codes.length)return {state:'nocode',codes};
  if(!(S.purchase||[]).some(x=>x.kind!=='note'))return {state:'nodata',codes};
  const bs=codes.map(baseCode);
  const ls=purLines().filter(x=>bs.includes(baseCode(x.project)));
  if(!ls.length)return {state:'none',codes};
  const act=ls.filter(x=>x.st!=='cancel'),done=act.filter(x=>x.st==='done'),open=act.filter(x=>x.st!=='done');
  const recv=done.map(x=>x.recvDate).filter(Boolean).sort();
  const dues=act.map(x=>x.due).filter(Boolean).sort();
  const eta=dues[dues.length-1]||'';const t=fd(today());
  const state=!act.length?'done':open.length?(eta&&eta<t?'late':'open'):'done';
  const dleft=eta?diff(today(),pd(eta)):null;
  return {state,codes,n:act.length,done:done.length,open:open.length,late:state==='late'?open.length:0,lastRecv:recv[recv.length-1]||'',eta,dleft,nextDue:eta,lastDue:eta,lines:ls};
}

function parseBuySheets(list){
  let best=null;
  for(const {name,rows} of list){
    for(let i=0;i<Math.min(10,rows.length);i++){
      const map={};rows[i].forEach((c,j)=>{const h=String(c||'').replace(/\s+/g,' ').trim();if(!h)return;for(const [k,,re] of BUY_COLS){if(!Object.values(map).includes(k)&&re.test(h)){map[j]=k;break}}});
      const n=Object.keys(map).length;
      if(n>=6&&(!best||n>best.n||(/구매/.test(name)&&!/구매/.test(best.name)))){best={name,n,hi:i,map,rows}}
    }
  }
  if(!best)throw new Error('구매 LIST 양식(납품처/고객사, 문서번호, 품목, 비고 1, 납품현황 …)의 머리글을 찾지 못했습니다.');
  const out=[];
  best.rows.slice(best.hi+1).forEach((r,i)=>{const o={row:best.hi+i+2};let any=false;Object.keys(best.map).forEach(j=>{const v=String(r[j]??'').replace(/^\t+/,'').replace(/\r/g,'').trim();if(v)any=true;o[best.map[j]]=v});if(any&&(o.item||o.cust||o.doc))out.push(o)});
  return {sheet:best.name,rows:out};
}

const REGION_ORDER=['국내','베트남','일본','중국','대만','필리핀','말레이시아','태국','인도','미국','멕시코','기타'];
let CUS=null; // config 'customers'.list
function cusList(){return CUS||CUS_DEF}
const cuNorm=s=>String(s||'').toUpperCase().replace(/\(주\)|㈜|주식회사|\bCO\.?,?\s*LTD\.?|\bINC\.?|\bCORP(ORATION)?\.?/g,' ').replace(/[^0-9A-Z가-힣]+/g,'');
const cuTokens=s=>String(s||'').toUpperCase().split(/[^0-9A-Z가-힣]+/).filter(Boolean);
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const cuCache=new Map();
function custMatch(text){
  const raw=String(text||'');if(!raw.trim())return null;
  const key=raw+'|'+(CUS?CUS.length:0);if(cuCache.has(key))return cuCache.get(key);
  const nt=cuNorm(raw),toks=cuTokens(raw);let best=null,bl=0,fuzzy=null;
  for(const c of cusList()){
    for(const al of [c.name,c.full,...(c.aliases||[])].filter(Boolean)){
      const na=cuNorm(al);if(!na)continue;
      const latin=/^[0-9A-Z]+$/.test(na);
      const hit=latin&&na.length<=4?toks.includes(na):nt.includes(na);
      if(hit&&(na.length>bl||(na.length===bl&&best&&best.region==='국내'&&c.region!=='국내'))){best=c;bl=na.length}
      if(!hit&&!fuzzy&&latin&&na.length>=5){const lim=na.length>=8?2:1;if(toks.some(t=>t.length>=4&&lev(t,na)<=lim)||(nt.length<=na.length+2&&lev(nt,na)<=lim))fuzzy=c}
    }
  }
  const r=best||fuzzy;if(cuCache.size>3000)cuCache.clear();cuCache.set(key,r);return r;
}
const buyCust=r=>custMatch(r.cust)||custMatch([r.item,r.equip,r.note2,r.progress].join(' '));
function cuRegions(){const rs=[...new Set(cusList().map(c=>c.region||'기타'))];return rs.sort((a,b)=>{const i=REGION_ORDER.indexOf(a),j=REGION_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b,'ko')})}
function cuPass(r,sel){
  const c=buyCust(r);
  if(!sel||sel==='reg')return !!c;if(sel==='all')return true;if(sel==='un')return !c;
  if(sel==='abroad')return !!c&&c.region!=='국내';
  if(sel.startsWith('R:'))return !!c&&(c.region||'기타')===sel.slice(2);
  if(sel.startsWith('C:'))return !!c&&c.id===sel.slice(2);
  return true;
}
function cuChips(rows){
  const sel=BU.f.cu||'reg',cnt=f=>rows.filter(r=>cuPass(r,f)).length;
  const chip=(v,l,n)=>`<button class="chip ${sel===v?'on':''}" data-act="cuF" data-v="${esc(v)}">${l} <b>${n}</b></button>`;
  let h=`<div class="chips" style="margin-bottom:6px">${chip('reg','등록 고객사',cnt('reg'))}${chip('R:국내','국내',cnt('R:국내'))}${chip('abroad','국외',cnt('abroad'))}${cuRegions().filter(x=>x!=='국내').map(x=>chip('R:'+x,'· '+esc(x),cnt('R:'+x))).join('')}${chip('un','미등록',cnt('un'))}${chip('all','전체',rows.length)}</div>`;
  h+=`<div class="chips">${cuRegions().map(x=>cusList().filter(c=>(c.region||'기타')===x).map(c=>{const n=cnt('C:'+c.id);return chip('C:'+c.id,esc(c.name),n)}).join('')).join('<span class="muted" style="align-self:center">|</span>')}</div>`;
  return h;
}
function cuPill(r){const c=buyCust(r);return c?`<span class="pill ${c.region==='국내'?'acc':'warn'}">${esc(c.name)}</span><div class="muted" style="font-size:11px">${esc(c.region||'')}${r.cust&&cuNorm(r.cust)!==cuNorm(c.name)?' · '+esc(r.cust):''}</div>`:`<span class="pill">미등록</span><div class="muted" style="font-size:11px">${esc(r.cust||'(비어 있음)')}</div>`}

  return h+`</div>`;
}

async function cuSaveList(list,msg){
  try{await api('save',{col:'config',id:'customers',data:{list,updated:new Date().toISOString()}});CUS=list;cuCache.clear();lastSig='';closeModal();render();toast(msg||'저장했습니다');return true}catch(e){toast('저장하지 못했습니다: '+(e.message||''));return false}

async function cuAct(a,d,el){
  if(a==='cuF'){BU.f.cu=d.v;render();return}
  if(a==='cuNew'){cuModal(null);return}
  if(a==='cuEdit'){cuModal(cusList().find(c=>c.id===d.id));return}
  if(a==='cuAddFrom'){cuModal(null,d.v);return}
  if(a==='cuDel'){if(!el.classList.contains('arm')){el.classList.add('arm');el.textContent='한 번 더 누르면 삭제';return}const id=modalCtx.data.id;await cuSaveList(cusList().filter(c=>c.id!==id).map(c=>Object.assign({},c)),'삭제했습니다');return}
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='cuForm')return;e.preventDefault();
  const c=modalCtx.data,to=$('#cu_to')?$('#cu_to').value:'';
  const aliases=[...new Set($('#cu_alias').value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean))];
  const list=cusList().map(x=>Object.assign({},x));
  if(to){const x=list.find(y=>y.id===to);x.aliases=aliases;await cuSaveList(list,`${x.name}에 이름을 추가했습니다`);return}
  const name=$('#cu_name').value.trim();if(!name){toast('고객사 이름을 넣어 주세요');return}
  const o={id:c.id||('c'+Date.now().toString(36)),name,full:$('#cu_full').value.trim(),region:$('#cu_region').value.trim()||'기타',aliases};
  const i=list.findIndex(y=>y.id===o.id);if(i>=0)list[i]=o;else list.push(o);
  await cuSaveList(list);
});

async function tmAct(a,d,el){
  if(a==='tmHelp'){tmHelp();return}
  const busy=t=>{el.disabled=true;el.dataset.t=el.textContent;el.textContent=t},done=()=>{el.disabled=false;el.textContent=el.dataset.t};
  try{
    if(a==='tmSave'){busy('저장 중…');const wh=$('#tm_wh').value.trim();TM.info=await api('teamsSave',{webhook:wh,days:+$('#tm_days').value||7,hour:+$('#tm_hour').value,enabled:$('#tm_on').checked,site:location.origin+location.pathname+'#purchase'});TM.err='';toast('Teams 알림 설정을 저장했습니다');render();return}
    if(a==='tmTest'){busy('보내는 중…');await api('teamsTest');done();toast('Teams로 연결 확인 메시지를 보냈습니다');return}
    if(a==='tmRun'){busy('확인 중…');const j=await api('teamsRun');done();toast(j.sent?`입고예정 알림 ${j.sent}건을 Teams로 보냈습니다`:'지금 보낼 입고예정 알림이 없습니다');TM.info=null;tmLoad();return}
  }catch(e){done();toast(e.message||'실패했습니다')}
}

let BS={};
async function buySheetPull(src){
  src=src||BS.url;if(!src){buySheetSetup();return}
  toast('구글 시트를 읽는 중…');
  try{const j=await api('buySheetRead',{src});const r=parseBuySheets(j.sheets);
    if(!BS.url||BS.url!==j.url){BS={url:j.url,id:j.id,title:j.title};await api('save',{col:'config',id:'buySrc',data:{url:j.url,id:j.id,title:j.title,linkedAt:new Date().toISOString()}})}
    BU.pending={file:j.title+' (구글 시트)',sheet:r.sheet,rows:r.rows};closeModal();render()}
  catch(e){toast(e.message||'구글 시트를 읽지 못했습니다')}
}

document.addEventListener('submit',e=>{if(e.target.id!=='bsForm')return;e.preventDefault();const u=$('#bs_url').value.trim();if(!/docs\.google\.com\/spreadsheets\/d\//.test(u)){toast('구글 시트 주소(https://docs.google.com/spreadsheets/d/…)를 넣어 주세요');return}buySheetPull(u)});
async function bsAct(a,d,el){
  if(a==='bsPull'){buySheetPull();return}

}

  $('#modalRoot').innerHTML=`<div class="scrim" data-act="scrim"><div class="modal wiz" role="dialog" aria-modal="true" aria-label="즐겨찾기 만들기"><h3>즐겨찾기 버튼 만들기 — ${esc(name)}</h3><form id="bmForm"><div class="wbody" style="min-height:0">
