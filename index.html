<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BU2 셋업 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (tabs) + work surface; timelines scroll inside their own frame */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --line:#d6dce5; --line-soft:#e6eaf0;
  --fg:#18202b; --muted:#5d6878; --faint:#8a94a3;
  --accent:#2350b8; --accent-soft:#e3eafb; --accent-fg:#ffffff;
  --ok:#1f8a55; --ok-soft:#dff3e8; --warn:#b86e00; --warn-soft:#fbefd9; --bad:#c23434; --bad-soft:#f9e1e1;
  --c1:#2350b8; --c2:#1f8a55; --c3:#b86e00; --c4:#7b45b8; --c5:#7a8597; --c6:#0e8a91;
  --font:"IBM Plex Sans KR",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --sunk:#1e2833; --line:#2c3846; --line-soft:#232e3a;
  --fg:#e6ebf2; --muted:#9aa6b6; --faint:#6f7b8b;
  --accent:#6f97f2; --accent-soft:#1e2c4a; --accent-fg:#0d1420;
  --ok:#4cc48a; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c14; --bad:#f07070; --bad-soft:#3d1c1e;
  --c1:#6f97f2; --c2:#4cc48a; --c3:#e3a33f; --c4:#b48cf0; --c5:#8a96a8; --c6:#45c2c8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --sunk:#1e2833; --line:#2c3846; --line-soft:#232e3a;
  --fg:#e6ebf2; --muted:#9aa6b6; --faint:#6f7b8b;
  --accent:#6f97f2; --accent-soft:#1e2c4a; --accent-fg:#0d1420;
  --ok:#4cc48a; --ok-soft:#173326; --warn:#e3a33f; --warn-soft:#3a2c14; --bad:#f07070; --bad-soft:#3d1c1e;
  --c1:#6f97f2; --c2:#4cc48a; --c3:#e3a33f; --c4:#b48cf0; --c5:#8a96a8; --c6:#45c2c8;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:208px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.tab{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--sunk);color:var(--fg)}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab .n{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--bad-soft);color:var(--bad);padding:0 6px;border-radius:9px}
.tab svg{width:16px;height:16px;flex:none}
.rail .foot{margin-top:auto;font-size:11px;color:var(--faint);padding:0 10px}
main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.head h1{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.head .sub{color:var(--muted);font-size:13px}
.head .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
a.btn{text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;font-weight:600}
.panel>h2 .sp{flex:1}
.panel .body{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .h{font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{font-size:12px;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--fg)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.done{background:var(--ok)}
/* timeline */
.tl{overflow:auto;max-height:70vh;border-top:1px solid var(--line-soft)}
.tl-in{position:relative}
.tl-row{display:flex;border-bottom:1px solid var(--line-soft);min-height:34px}
.tl-lab{position:sticky;left:0;z-index:2;background:var(--surface);width:220px;flex:none;padding:6px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
.tl-lab .a{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lab .b{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lab.grp{background:var(--sunk);font-weight:700;font-size:12px;letter-spacing:.03em}
.tl-row.grp{background:var(--sunk);min-height:28px}
.tl-row.sub .tl-lab{padding-left:26px}
.tl-row.sub .tl-lab .a{font-weight:500;font-size:12px}
.tl-trk{position:relative;flex:none}
.tl-head{position:sticky;top:0;z-index:3;background:var(--surface)}
.tl-head .tl-lab{z-index:4;font-size:11px;color:var(--muted)}
.hm{display:flex;border-bottom:1px solid var(--line-soft)}
.hm div{font-size:11px;font-weight:600;padding:3px 6px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.hd{display:flex}
.hd div{font-size:10px;text-align:center;color:var(--faint);font-family:var(--mono);border-left:1px solid var(--line-soft);padding:2px 0}
.hd div.we{background:var(--sunk)}
.hd div.td{color:var(--accent);font-weight:700}
.gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.we-bg{position:absolute;top:0;bottom:0;background:var(--sunk);opacity:.55}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:1;pointer-events:none}
.bk{position:absolute;height:20px;border-radius:4px;font-size:11px;line-height:20px;padding:0 6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--c1);border:0;text-align:left;z-index:1}
.bk:hover{filter:brightness(1.08)}
.bk.ghost{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.bk .pf{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.9}
.bk span{position:relative}
.bk.late{background:var(--bad)}
.bk.done{background:var(--ok)}
.bk.todo{background:var(--c5)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px}
.tlbar .rng{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em;background:var(--surface);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:13px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
/* equipment cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.card .ch{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line-soft)}
.card .ch .ti{flex:1;min-width:0}
.card .ch .ti b{display:block;font-size:14px}
.card .ch .ti span{font-size:12px;color:var(--muted)}
.card .pc{font-family:var(--mono);font-size:22px;font-weight:500}
.card .pb{padding:10px 14px 4px}
.chk{display:flex;flex-direction:column;padding:4px 8px 10px}
.chk label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}
.chk label:hover{background:var(--sunk)}
.chk label.d .nm{color:var(--faint);text-decoration:line-through}
.chk .nm{flex:1;min-width:0}
.chk .dt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.chk .dt.late{color:var(--bad);font-weight:600}
.sitehd{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:6px 0 -4px;display:flex;gap:8px;align-items:center}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line-soft);font-size:15px}
.modal form{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld label em{color:var(--bad);font-style:normal}
.fld input,.fld select{width:100%}
.mact{grid-column:1/-1;display:flex;gap:8px;padding-top:4px}
.mact .sp{flex:1}
.items{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:22px minmax(0,1fr) 128px 128px 28px;gap:6px;align-items:center}
.irow input[type=text]{width:100%}
.irow .x{border:0;background:none;cursor:pointer;color:var(--faint);font-size:16px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}
.modal.wiz{width:min(720px,100%)}
.wsteps{display:flex;gap:4px;padding:12px 18px 0;overflow-x:auto}
.ws{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;color:var(--faint);font-size:11px;padding:4px 2px}
.ws i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:600;font-family:var(--mono)}
.ws span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ws.on{color:var(--accent);font-weight:600}.ws.on i{background:var(--accent);color:var(--accent-fg)}
.ws.done i{background:var(--ok-soft);color:var(--ok)}
.wbody{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-height:200px}
.wbody h4{margin:0;font-size:15px}
.wbody ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.6}
.wbody code{font-family:var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:12px}
.wbody a.btn{align-self:flex-start;text-decoration:none}
@media (max-width:860px){.ws span{display:none}}
.bk.jira{background:repeating-linear-gradient(135deg,var(--c4) 0 6px,color-mix(in srgb,var(--c4) 78%,#000) 6px 12px)}
.jsw{background:repeating-linear-gradient(135deg,var(--c4) 0 3px,color-mix(in srgb,var(--c4) 70%,#000) 3px 6px)}
.mobnav{display:none}
/* jira block */
.jr{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
.jr:last-child{border-bottom:0}
.jr .k{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;font-weight:500}
.jr .k:hover{text-decoration:underline}
.jr .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr .w{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.jmsg{padding:18px 14px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.jmsg b{color:var(--fg)}
.jstamp{font-size:11px;color:var(--faint);font-weight:400;font-family:var(--mono)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mobnav{display:flex;gap:4px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobnav .tab{padding:6px 10px;white-space:nowrap;font-size:13px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .tl-lab{width:140px}
  .modal form{grid-template-columns:1fr}
  .irow{grid-template-columns:22px minmax(0,1fr) 28px}
  .irow input[type=date]{grid-column:2/3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="탭"></nav>
  <div style="min-width:0">
    <nav class="mobnav" id="mobnav" aria-label="탭"></nav>
    <main><div class="wrap" id="view"></div></main>
  </div>
</div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
// ---------- constants ----------
const TABS=[
  {k:'home',l:'홈',i:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'},
  {k:'gantt',l:'셋업 간트',i:'<path d="M4 5h9M7 10h11M5 15h7M10 20h9"/>'},
  {k:'people',l:'인원 스케쥴',i:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'},
  {k:'progress',l:'설비 진행율',i:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {k:'trouble',l:'트러블 리스트',i:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'},
  {k:'admin',l:'기준정보',i:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'}
];
const SCH_TYPES=[
  {k:'셋업',c:'var(--c1)'},{k:'현장지원',c:'var(--c6)'},{k:'A/S',c:'var(--c3)'},
  {k:'교육',c:'var(--c4)'},{k:'사무',c:'var(--c5)'},{k:'휴가',c:'var(--c2)'}
];
const FIELD_TYPES=['셋업','현장지원','A/S']; // counted as 출장일
const EQ_STATUS=['대기','진행','완료','보류'];
const TR_STATUS=['접수','진행','모니터링','완료'];
const TR_CAT=['HW','SW','Vision','Motion','Handler','고객요청','기타'];
const TR_PRI=['상','중','하'];
const DEFAULT_ITEMS=['설비 반입','설치·레벨링','전원·유틸리티 연결','SW 설치·통신 확인','Calibration','Teaching·레시피','Gage R&R','양산 검증','고객 Buy-off'];

// ---------- state ----------
const S={sites:[],members:[],equips:[],schedules:[],troubles:[]};
let loaded={};let db=null;let dl=null;let canWrite=true;let dbState='wait';
let tab=readTab();
const ui={gZoom:'week',gStart:null,pZoom:'week',pStart:null,open:{},trF:{site:'',status:'open',q:'',cat:''},pSite:'',prSite:''};
function readTab(){const h=(location.hash||'').slice(1);if(TABS.some(t=>t.k===h))return h;try{const v=localStorage.getItem('bu2tab');if(TABS.some(t=>t.k===v))return v}catch(e){}return 'home'}

// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diff=(a,b)=>Math.round((b-a)/864e5);
const short=s=>{const d=pd(s);return d?(d.getMonth()+1)+'/'+d.getDate():'–'};
const DOW='일월화수목금토';
const uid=()=>Math.random().toString(36).slice(2,10);

const memberName=id=>{const m=S.members.find(x=>x.id===id);return m?m.name:'(미지정)'};
const equipName=id=>{const e=S.equips.find(x=>x.id===id);return e?e.model+(e.unit?' #'+e.unit:''):''};
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko');
function eqProg(e){const it=e.items||[];if(!it.length)return e.status==='완료'?100:0;return Math.round(it.filter(i=>i.done).length/it.length*100)}
function eqRange(e){let s=null,f=null;for(const i of (e.items||[])){const a=pd(i.start),b=pd(i.end)||a;if(a&&(!s||a<s))s=a;if(b&&(!f||b>f))f=b}if(!s){s=pd(e.start);f=pd(e.end)||s}return s?{s,f}:null}
function itemLate(i){const e=pd(i.end);return !i.done&&e&&e<today()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

// 배포 후 Apps Script 웹 앱 URL을 여기에 넣으면 팀원 모두 같은 데이터를 봅니다.
const DEFAULT_API_URL='https://github.com/roy1149/BU2-Setup-Board/edit/main/index.html';
const COLS=['sites','members','equips','schedules','troubles'];
let API_URL='',API_KEY='',pollT=null,lastSig='';
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function api(action,body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,key:API_KEY},body||{}))});
  if(!r.ok)throw {code:'http',message:'HTTP '+r.status};
  const j=await r.json();
  if(!j.ok)throw {code:j.code||'server',message:j.error||'서버 오류'};
  return j;
}
function applyAll(data){
  const sig=JSON.stringify(data);if(sig===lastSig)return false;lastSig=sig;
  for(const c of COLS)S[c]=(data[c]||[]);
  const cfg=(data.config||[]).find(x=>x.id==='jira');JC=Object.assign({},cfg||{});JC._loaded=true;
  return true;
}
async function load(){
  try{const j=await api('load');dbState='on';if(applyAll(j.data)){render();jiraEnsure();btEnsure()}else if(J.state==='init'){jiraEnsure();btEnsure()}}
  catch(e){
    if(e.code==='auth'){dbState='auth';render();return}
    if(dbState!=='on'){dbState='off';render()}else toast('서버와 동기화하지 못했습니다. 잠시 후 다시 시도합니다');
  }
}
async function initDb(){
  API_URL=lsGet('bu2api')||DEFAULT_API_URL;API_KEY=lsGet('bu2key');
  if(!API_URL){dbState='nourl';render();return}
  dbState='wait';render();
  await load();
  clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden&&!modalCtx)load()},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
}
async function save(col,id,data){
  if(dbState!=='on'){toast('서버에 연결되지 않아 저장할 수 없습니다');return false}
  try{const j=await api('save',{col,id:id||'',data});
    const list=S[col]||(S[col]=[]);const i=list.findIndex(x=>x.id===j.id);const row=Object.assign({id:j.id},data);if(i>=0)list[i]=row;else list.push(row);
    lastSig='';render();if(col==='members')jiraEnsure();return true}
  catch(e){toast(e.code==='auth'?'팀 접속 키가 맞지 않아 저장하지 못했습니다':'저장하지 못했습니다: '+(e.message||'네트워크 오류'));return false}
}
async function del(col,id){
  try{await api('delete',{col,id});S[col]=S[col].filter(x=>x.id!==id);lastSig='';render();toast('삭제했습니다')}catch(e){toast('삭제하지 못했습니다')}
}
async function saveConfig(o){
  try{await api('save',{col:'config',id:'jira',data:o});JC=Object.assign({},o,{_loaded:true});lastSig='';render();jiraEnsure(true);btEnsure();return true}catch(e){toast('저장하지 못했습니다');return false}
}
function strip(o){const r={};for(const k in o)if(k!=='id')r[k]=o[k];return r}
const GAS_CODE="/**\n * BU2 셋업 보드 — Google Apps Script 백엔드\n * - 데이터: 이 스프레드시트의 시트(sites, members, equips, schedules, troubles, config)에 저장\n * - Jira: 스크립트 속성의 Jira API 토큰으로 Jira Cloud REST API를 대신 호출\n *\n * 스크립트 속성 (프로젝트 설정 → 스크립트 속성)\n *   TEAM_KEY    (선택) 팀 접속 키. 넣으면 키를 아는 사람만 읽고 쓸 수 있음\n *   JIRA_SITE   예: https://do-intekplus.atlassian.net\n *   JIRA_EMAIL  Jira 계정 이메일 (API 토큰 발급자)\n *   JIRA_TOKEN  https://id.atlassian.com/manage-profile/security/api-tokens 에서 발급\n */\nvar COLS = ['sites', 'members', 'equips', 'schedules', 'troubles', 'config'];\n\nfunction doGet() {\n  return out_({ ok: true, msg: 'BU2 셋업 보드 서버가 동작 중입니다.' });\n}\n\nfunction doPost(e) {\n  try {\n    var req = JSON.parse(e.postData.contents || '{}');\n    var props = PropertiesService.getScriptProperties();\n    var teamKey = props.getProperty('TEAM_KEY');\n    if (teamKey && req.key !== teamKey) return out_({ ok: false, code: 'auth', error: '팀 접속 키가 맞지 않습니다.' });\n\n    switch (req.action) {\n      case 'load': return out_({ ok: true, data: loadAll_() });\n      case 'save': return out_({ ok: true, id: save_(req.col, req.id, req.data) });\n      case 'delete': remove_(req.col, req.id); return out_({ ok: true });\n      case 'jiraSearch': return out_(jiraSearch_(req.jql, req.max));\n      case 'jiraUser': return out_(jiraUser_(req.query));\n      case 'jiraFields': return out_(jiraFields_(req.project));\n      case 'jiraTrips': return out_(jiraTrips_(req));\n      case 'jiraUpdateTrip': return out_(jiraUpdateTrip_(req));\n      default: return out_({ ok: false, code: 'bad_request', error: '알 수 없는 요청: ' + req.action });\n    }\n  } catch (err) {\n    return out_({ ok: false, code: 'server', error: String(err && err.message || err) });\n  }\n}\n\nfunction out_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n\n// ---------- 데이터 ----------\nfunction sheet_(col) {\n  if (COLS.indexOf(col) < 0) throw new Error('허용되지 않은 컬렉션: ' + col);\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sh = ss.getSheetByName(col);\n  if (!sh) {\n    sh = ss.insertSheet(col);\n    sh.getRange(1, 1, 1, 3).setValues([['id', 'json', 'updated']]);\n    sh.setFrozenRows(1);\n  }\n  return sh;\n}\n\nfunction rows_(col) {\n  var sh = sheet_(col);\n  var n = sh.getLastRow() - 1;\n  if (n < 1) return [];\n  return sh.getRange(2, 1, n, 2).getValues();\n}\n\nfunction loadAll_() {\n  var data = {};\n  COLS.forEach(function (c) {\n    data[c] = rows_(c).filter(function (r) { return r[0]; }).map(function (r) {\n      var o = {};\n      try { o = JSON.parse(r[1]); } catch (e) {}\n      o.id = String(r[0]);\n      return o;\n    });\n  });\n  return data;\n}\n\nfunction save_(col, id, data) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var sh = sheet_(col);\n    if (!id) id = Utilities.getUuid().replace(/-/g, '').slice(0, 20);\n    if (data && data.id) delete data.id;\n    var json = JSON.stringify(data || {});\n    var now = new Date();\n    var rows = rows_(col);\n    for (var i = 0; i < rows.length; i++) {\n      if (String(rows[i][0]) === String(id)) {\n        sh.getRange(i + 2, 2, 1, 2).setValues([[json, now]]);\n        return id;\n      }\n    }\n    sh.appendRow([id, json, now]);\n    return id;\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction remove_(col, id) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var sh = sheet_(col);\n    var rows = rows_(col);\n    for (var i = rows.length - 1; i >= 0; i--) {\n      if (String(rows[i][0]) === String(id)) sh.deleteRow(i + 2);\n    }\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n// ---------- Jira ----------\nfunction jiraConf_() {\n  var p = PropertiesService.getScriptProperties();\n  var site = (p.getProperty('JIRA_SITE') || '').replace(/\\/+$/, '');\n  var email = p.getProperty('JIRA_EMAIL');\n  var token = p.getProperty('JIRA_TOKEN');\n  if (!site || !email || !token) return null;\n  if (!/^https?:\\/\\//.test(site)) site = 'https://' + site;\n  return { site: site, auth: 'Basic ' + Utilities.base64Encode(email + ':' + token) };\n}\n\nfunction jiraFetch_(conf, path, opt) {\n  opt = opt || {};\n  var res = UrlFetchApp.fetch(conf.site + path, {\n    method: opt.method || 'get',\n    contentType: 'application/json',\n    payload: opt.body ? JSON.stringify(opt.body) : undefined,\n    headers: { Authorization: conf.auth, Accept: 'application/json' },\n    muteHttpExceptions: true\n  });\n  var code = res.getResponseCode();\n  var text = res.getContentText();\n  if (code >= 300) {\n    var msg = text;\n    try { var j = JSON.parse(text); msg = (j.errorMessages || []).concat(Object.values(j.errors || {})).join(' / ') || text; } catch (e) {}\n    return { ok: false, code: 'jira_http', error: 'HTTP ' + code + ' ' + String(msg).slice(0, 300) };\n  }\n  return { ok: true, body: text ? JSON.parse(text) : {} };\n}\n\n/** API 토큰으로 실제 로그인되는지 확인. 토큰이 틀리면 Jira가 0건을 돌려주기 때문에 0건일 때 함께 검사 */\nfunction jiraAuthCheck_(conf) {\n  var r = jiraFetch_(conf, '/rest/api/3/myself');\n  if (r.ok && r.body && r.body.accountId) return null;\n  return { ok: false, code: 'jira_auth', error: 'Jira 로그인에 실패했습니다. API 토큰이 취소되었거나 JIRA_EMAIL/JIRA_TOKEN이 맞지 않습니다.' + (r.ok ? '' : ' (' + r.error + ')') };\n}\n\nfunction jiraSearch_(jql, max) {\n  var conf = jiraConf_();\n  if (!conf) return { ok: false, code: 'jira_config', error: 'Jira 연결 정보가 없습니다.' };\n  if (!jql) return { ok: false, code: 'bad_request', error: 'JQL이 비어 있습니다.' };\n  var r = jiraFetch_(conf, '/rest/api/3/search/jql', {\n    method: 'post',\n    body: {\n      jql: jql,\n      maxResults: Math.min(Number(max) || 50, 100),\n      fields: ['summary', 'status', 'assignee', 'reporter', 'creator', 'updated', 'created', 'issuetype', 'priority', 'project']\n    }\n  });\n  if (!r.ok) return r;\n  if (!(r.body.issues || []).length) { var a = jiraAuthCheck_(conf); if (a) return a; }\n  // 응답 크기를 줄여 필요한 필드만 돌려줌\n  var issues = (r.body.issues || []).map(function (x) {\n    var f = x.fields || {};\n    var u = function (p) { return p ? { displayName: p.displayName, accountId: p.accountId } : null; };\n    return {\n      key: x.key,\n      fields: {\n        summary: f.summary,\n        status: f.status ? { name: f.status.name, statusCategory: { key: f.status.statusCategory && f.status.statusCategory.key } } : null,\n        issuetype: f.issuetype ? { name: f.issuetype.name } : null,\n        priority: f.priority ? { name: f.priority.name } : null,\n        project: f.project ? { key: f.project.key } : null,\n        assignee: u(f.assignee), reporter: u(f.reporter), creator: u(f.creator),\n        updated: f.updated, created: f.created\n      }\n    };\n  });\n  return { ok: true, site: conf.site, issues: issues };\n}\n\nfunction jiraUser_(query) {\n  var conf = jiraConf_();\n  if (!conf) return { ok: false, code: 'jira_config', error: 'Jira 연결 정보가 없습니다.' };\n  var r = jiraFetch_(conf, '/rest/api/3/user/search?maxResults=10&query=' + encodeURIComponent(query || ''));\n  if (!r.ok) return r;\n  var users = (r.body || []).filter(function (u) { return u.accountType === 'atlassian'; }).map(function (u) {\n    return { accountId: u.accountId, displayName: u.displayName, emailAddress: u.emailAddress || '' };\n  });\n  return { ok: true, users: users };\n}\n\n// ---------- Jira 출장 (BT 보드) ----------\nvar SKIP_FIELDS_ = ['description', 'comment', 'attachment', 'worklog', 'issuelinks', 'subtasks', 'watches', 'votes', 'timetracking', 'aggregateprogress', 'progress', 'lastViewed', 'thumbnail', 'environment'];\n\n/** 값(문자열·날짜·옵션·사용자·배열 등)을 화면에 쓸 글자로 바꿈 */\nfunction toText_(v) {\n  if (v === null || v === undefined) return '';\n  if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') return String(v);\n  if (Array.isArray(v)) return v.map(toText_).filter(String).join(', ');\n  if (typeof v === 'object') {\n    if (v.displayName) return v.displayName;\n    if (v.value !== undefined) return toText_(v.value) + (v.child ? ' / ' + toText_(v.child) : '');\n    if (v.name) return v.name;\n    if (v.key) return v.key;\n    if (v.type === 'doc') return '(문서)';\n  }\n  return '';\n}\nfunction isDateLike_(v) {\n  return typeof v === 'string' && /^\\d{4}-\\d{2}-\\d{2}/.test(v);\n}\n\n/** BT 이슈를 몇 건 읽어 값이 있는 필드 목록(이름·예시·날짜 여부)을 돌려줌 */\nfunction jiraFields_(project) {\n  var conf = jiraConf_();\n  if (!conf) return { ok: false, code: 'jira_config', error: 'Jira 연결 정보가 없습니다.' };\n  var p = String(project || 'BT').replace(/\"/g, '');\n  var r = jiraFetch_(conf, '/rest/api/3/search/jql', {\n    method: 'post',\n    body: { jql: 'project = \"' + p + '\" ORDER BY created DESC', maxResults: 30, fields: ['*all'], expand: 'names' }\n  });\n  if (!r.ok) return r;\n  var names = r.body.names || {};\n  var issues = r.body.issues || [];\n  if (!issues.length) return { ok: false, code: 'jira_http', error: p + ' 프로젝트에서 이슈를 찾지 못했습니다. 프로젝트 키와 권한을 확인하세요.' };\n  var out = [];\n  Object.keys(names).forEach(function (id) {\n    if (SKIP_FIELDS_.indexOf(id) >= 0) return;\n    var sample = '', date = false, seen = 0;\n    issues.forEach(function (x) {\n      var v = (x.fields || {})[id];\n      if (v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length)) return;\n      seen++;\n      if (isDateLike_(v)) date = true;\n      if (!sample) sample = toText_(v).slice(0, 30);\n    });\n    if (seen) out.push({ id: id, name: names[id], date: date, sample: sample, seen: seen });\n  });\n  out.sort(function (a, b) { return b.seen - a.seen; });\n  return { ok: true, fields: out };\n}\n\n/** BT 출장 이슈를 날짜·이름·출장지로 정리해 돌려줌 (최대 500건) */\nfunction jiraTrips_(req) {\n  var conf = jiraConf_();\n  if (!conf) return { ok: false, code: 'jira_config', error: 'Jira 연결 정보가 없습니다.' };\n  if (!req.jql) return { ok: false, code: 'bad_request', error: 'JQL이 비어 있습니다.' };\n  var fStart = req.start, fEnd = req.end || req.start, fSite = req.site, fPerson = req.person === 'reporter' ? 'reporter' : 'assignee';\n  var fields = ['summary', 'status', 'assignee', 'reporter', 'duedate'];\n  [fStart, fEnd, fSite].forEach(function (f) { if (f && fields.indexOf(f) < 0) fields.push(f); });\n  var trips = [], token = null;\n  for (var page = 0; page < 5; page++) {\n    var body = { jql: req.jql, maxResults: 100, fields: fields };\n    if (token) body.nextPageToken = token;\n    var r = jiraFetch_(conf, '/rest/api/3/search/jql', { method: 'post', body: body });\n    if (!r.ok) return r;\n    (r.body.issues || []).forEach(function (x) {\n      var f = x.fields || {};\n      var who = f[fPerson];\n      var sRaw = toText_(f[fStart]), eRaw = toText_(f[fEnd]);\n      var s = sRaw.slice(0, 10), e = eRaw.slice(0, 10);\n      trips.push({\n        key: x.key,\n        summary: f.summary || '',\n        status: f.status ? f.status.name : '',\n        person: who ? who.displayName : '',\n        personId: who ? who.accountId : '',\n        start: isDateLike_(s) ? s : '',\n        end: isDateLike_(e) ? e : '',\n        startRaw: isDateLike_(sRaw) ? sRaw : '',\n        endRaw: isDateLike_(eRaw) ? eRaw : '',\n        site: fSite ? toText_(f[fSite]).slice(0, 60) : ''\n      });\n    });\n    token = r.body.nextPageToken;\n    if (!token || r.body.isLast) break;\n  }\n  if (!trips.length) { var a = jiraAuthCheck_(conf); if (a) return a; }\n  return { ok: true, site: conf.site, trips: trips };\n}\n\n/** 출장 이슈의 시작일·종료일(과 제목 속 날짜)을 Jira에 반영 (토큰 소유자의 Jira 권한으로 수정) */\nfunction jiraUpdateTrip_(req) {\n  var conf = jiraConf_();\n  if (!conf) return { ok: false, code: 'jira_config', error: 'Jira 연결 정보가 없습니다.' };\n  if (!req.key || !/^[A-Z][A-Z0-9_]+-\\d+$/.test(req.key)) return { ok: false, code: 'bad_request', error: '이슈 키가 올바르지 않습니다.' };\n  var fields = {};\n  Object.keys(req.fields || {}).forEach(function (k) {\n    var v = req.fields[k];\n    if (k === 'summary') { if (v) fields.summary = String(v).slice(0, 255); return; }\n    if (!/^(customfield_\\d+|duedate)$/.test(k)) // ---------- TIMELINE ----------
const ZOOM={week:{w:30,days:42,step:7},month:{w:11,days:120,step:30}};
function tlStart(key){if(!ui[key]){const t=today();ui[key]=addD(t,-((t.getDay()+6)%7)-7)}return ui[key]}
function lanes(bars){const ends=[];for(const b of bars.sort((a,c)=>a.s-c.s)){let l=ends.findIndex(e=>e<b.s);if(l<0){l=ends.length;ends.push(0)}ends[l]=b.f;b.lane=l}return Math.max(1,ends.length)}
function timeline(rows,zoomKey,startKey){
  const z=ZOOM[ui[zoomKey]],st=tlStart(startKey),W=z.w*z.days,t=today();
  let hm='',hd='',bg='';
  let cur=null,cs=0;
  for(let i=0;i<=z.days;i++){
    const d=addD(st,i),k=d.getFullYear()+'.'+(d.getMonth()+1);
    if(k!==cur||i===z.days){if(cur)hm+=`<div style="width:${(i-cs)*z.w}px">${cur}</div>`;cur=k;cs=i}
    if(i===z.days)break;
    const we=d.getDay()===0||d.getDay()===6,td=+d===+t;
    if(ui[zoomKey]==='week')hd+=`<div class="${we?'we':''}${td?' td':''}" style="width:${z.w}px">${d.getDate()}<br>${DOW[d.getDay()]}</div>`;
    else if(d.getDay()===1)hd+=`<div style="position:absolute;left:${i*z.w}px;width:${7*z.w}px;text-align:left;padding-left:3px">${d.getDate()}</div>`;
    if(we&&ui[zoomKey]==='week')bg+=`<div class="we-bg" style="left:${i*z.w}px;width:${z.w}px"></div>`;
    if(d.getDay()===1)bg+=`<div class="gl" style="left:${i*z.w}px"></div>`;
  }
  const ti=diff(st,t);const tdl=ti>=0&&ti<z.days?`<div class="today" style="left:${ti*z.w+z.w/2}px"></div>`:'';
  let h=`<div class="tl"><div class="tl-in" style="width:${220+W}px">`;
  h+=`<div class="tl-row tl-head"><div class="tl-lab">${ui[zoomKey]==='week'?'일 단위':'주 단위 (월요일)'}</div><div class="tl-trk" style="width:${W}px"><div class="hm">${hm}</div><div class="hd" style="position:relative;${ui[zoomKey]==='month'?'height:18px':''}">${hd}</div></div></div>`;
  for(const r of rows){
    if(r.group){h+=`<div class="tl-row grp"><div class="tl-lab grp">${esc(r.group)}</div><div class="tl-trk" style="width:${W}px"></div></div>`;continue}
    const bars=(r.bars||[]).filter(b=>b.s);
    const n=lanes(bars);const H=Math.max(34,n*24+8);
    let bh='';
    for(const b of bars){
      let a=diff(st,b.s),e=diff(st,b.f||b.s)+1;
      if(e<=0||a>=z.days)continue;a=Math.max(a,0);e=Math.min(e,z.days);
      const w=Math.max((e-a)*z.w-2,6);
      bh+=`<button class="bk ${b.cls||''}" style="left:${a*z.w+1}px;width:${w}px;top:${6+b.lane*24}px;${b.color?'background:'+b.color:''}" title="${esc(b.tip||b.label)}" data-act="${b.act}" data-id="${b.id||''}" data-sub="${b.sub||''}">${b.pct!=null?`<i class="pf" style="width:${b.pct}%"></i>`:''}<span>${esc(b.label||'')}</span></button>`;
    }
    h+=`<div class="tl-row ${r.cls||''}" style="min-height:${H}px"><div class="tl-lab" ${r.act?`data-act="${r.act}" data-id="${r.id}" style="cursor:pointer"`:''}><span class="a">${r.lab}</span>${r.sub?`<span class="b">${r.sub}</span>`:''}</div><div class="tl-trk" style="width:${W}px">${bg}${tdl}${bh}</div></div>`;
  }
  if(!rows.length)h+=`<div class="empty" style="position:sticky;left:0;width:min(100%,600px)">표시할 항목이 없습니다.</div>`;
  h+=`</div></div>`;
  return h;
}
function tlBar(zoomKey,startKey,extra){
  const z=ZOOM[ui[zoomKey]],st=tlStart(startKey),en=addD(st,z.days-1);
  return `<div class="tlbar"><div class="seg"><button class="${ui[zoomKey]==='week'?'on':''}" data-act="zoom" data-k="${zoomKey}" data-v="week">일</button><button class="${ui[zoomKey]==='month'?'on':''}" data-act="zoom" data-k="${zoomKey}" data-v="month">월</button></div>
  <button class="btn sm" data-act="shift" data-k="${startKey}" data-z="${zoomKey}" data-d="-1" aria-label="이전">◀</button><button class="btn sm" data-act="shift" data-k="${startKey}" data-z="${zoomKey}" data-d="0">오늘</button><button class="btn sm" data-act="shift" data-k="${startKey}" data-z="${zoomKey}" data-d="1" aria-label="다음">▶</button>
  <span class="rng">${fd(st)} ~ ${fd(en)}</span><span style="flex:1"></span>${extra||''}</div>`;
}

      if(open)for(const it of (e.items||[])){

          bars:a?[{s:a,f:b,label:it.name,cls:it.done?'done':itemLate(it)?'late':'todo',act:'toggleItem',id:e.id,sub:it.id,tip:`${it.name} ${it.start}~${it.end||it.start} ${it.done?'완료':'클릭하면 완료 처리'}`}]:[]});
      }
    }
  }
  h+=`<div class="panel">${tlBar('gZoom','gStart',`<label class="muted" style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="gDone" data-act="gDone" ${showDone?'checked':''}>완료 설비 보기</label><button class="btn sm" data-act="expandAll">모두 펼치기</button><button class="btn sm" data-act="collapseAll">모두 접기</button>`)}
  ${timeline(rows,'gZoom','gStart')}
  <div class="tlbar legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>설비 전체 일정 (채움 = 진행율)</span><span><i style="background:var(--c5)"></i>예정</span><span><i style="background:var(--ok)"></i>완료</span><span><i style="background:var(--bad)"></i>지연</span><span>설비명을 누르면 항목이 펼쳐지고, 항목 막대를 누르면 완료/미완료가 바뀝니다.</span></div></div>`;
  return h;
}

function vPeople(){
  const jOn=ui.showJira!==false&&BT.state==='ok';
  let h=header('인원 스케쥴','개인별 셋업·출장·휴가 일정 · Jira 출장(BT) 함께 표시',`<button class="btn" data-act="csvSch">CSV 내보내기</button>`+(canWrite&&S.members.length?`<button class="btn pri" data-act="newSch">+ 일정 등록</button>`:''));
  const t=today(),ms=new Date(t.getFullYear(),t.getMonth(),1),me=new Date(t.getFullYear(),t.getMonth()+1,0);
  const people=peopleRows();
  if(!people.length)return h+`<div class="panel">${emptyBox('표시할 인원이 없습니다','기준정보에서 인원을 등록하거나, Jira 연동의 출장 일정(BT) 설정을 마치면 BT 보드에 등록된 이름이 자동으로 나타납니다.','<button class="btn pri" data-tab="admin">기준정보로 이동</button>')}</div>`;
  const rows=people.map(p=>{
    const list=p.m?S.schedules.filter(s=>s.member===p.m.id&&(!ui.pSite||s.site===ui.pSite)):[];
    const trips=jOn?p.trips:[];
    const days=fieldDays(list.concat(trips),ms,me);
    const bars=list.map(s=>({s:pd(s.start),f:pd(s.end)||pd(s.start),label:`${s.type} ${s.site?siteName(s.site):''}${s.equip?' '+equipName(s.equip):''}`,color:(SCH_TYPES.find(x=>x.k===s.type)||SCH_TYPES[0]).c,act:'editSch',id:s.id,tip:`${p.name} | ${s.type} | ${siteName(s.site)} | ${s.start}~${s.end||s.start}${s.note?' | '+s.note:''}`}))
      .concat(trips.filter(x=>x.start).map(x=>({s:pd(x.start),f:pd(x.end)||pd(x.start),label:`${x.key} ${x.site||x.summary}`,cls:'jira',act:'btEdit',id:x.key,tip:`Jira ${x.key} | ${p.name} | ${x.summary}${x.site?' | '+x.site:''} | ${x.start}~${x.end||x.start} | ${x.status} (누르면 일정 수정)`})));
    return {lab:esc(p.name)+(p.m?'':' <span class="pill" style="font-size:10px">Jira</span>'),sub:`${p.m&&p.m.title?esc(p.m.title)+' · ':''}이번 달 현장 ${days}일`,bars};
  });
  const sel=`<select id="pSite" data-act="pSite"><option value="">전체 사이트</option>${S.sites.sort(byName).map(s=>`<option value="${s.id}" ${ui.pSite===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
  const jt=`<label class="muted" style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="pJira" data-act="pJira" ${ui.showJira!==false?'checked':''}>Jira 출장 표시</label>${btStatus()}`;
  h+=`<div class="panel">${tlBar('pZoom','pStart',sel+jt)}${timeline(rows,'pZoom','pStart')}<div class="tlbar legend">${SCH_TYPES.map(x=>`<span><i style="background:${x.c}"></i>${x.k}</span>`).join('')}<span><i class="jsw"></i>Jira 출장 (BT)</span><span>Jira 막대를 누르면 출장 일정을 바꿀 수 있습니다.</span></div></div>`;
  const months=[];for(let i=5;i>=0;i--)months.push(new Date(t.getFullYear(),t.getMonth()-i,1));
  months.push(new Date(t.getFullYear(),t.getMonth()+1,1));
  h+=`<div class="panel"><h2>월별 현장 투입일<span class="muted" style="font-weight:400;font-size:12px">셋업·현장지원·A/S${jOn?'·Jira 출장':''} 일수 (주말 포함, 겹치는 날은 1일)</span></h2><div class="tw"><table><thead><tr><th>이름</th>${months.map(m=>`<th class="num">${m.getFullYear()%100}.${m.getMonth()+1}</th>`).join('')}<th class="num">합계</th></tr></thead><tbody>${people.map(p=>{
    const list=(p.m?S.schedules.filter(s=>s.member===p.m.id):[]).concat(jOn?p.trips:[]);let tot=0;
    const cells=months.map(mo=>{const v=fieldDays(list,mo,new Date(mo.getFullYear(),mo.getMonth()+1,0));tot+=v;return `<td class="num">${v||'<span class="muted">·</span>'}</td>`}).join('');
    return `<tr><td>${esc(p.name)}</td>${cells}<td class="num"><b>${tot}</b></td></tr>`}).join('')}</tbody></table></div></div>`;
  return h;
}
function fieldDays(list,a,b){const set=new Set();for(const s of list){if(!(s.jira||FIELD_TYPES.includes(s.type)))continue;let x=pd(s.start),y=pd(s.end)||x;if(!x)continue;if(x<a)x=a;if(y>b)y=b;for(let d=x;d<=y;d=addD(d,1))set.add(+d)}return set.size}
// 인원 행 = 기준정보 인원 + BT 보드 담당자(이름 기준). 계정번호 → 이름 순으로 매칭
function normName(s){return String(s||'').replace(/\s+/g,'').replace(/\(.*?\)/g,'').toLowerCase()}
function peopleRows(){
  const mem=[...S.members].sort((a,b)=>(a.order||0)-(b.order||0)||byName(a,b));
  const rows=mem.map(m=>({name:m.name,m,trips:[]}));
  const trips=ui.showJira===false?[]:BT.trips;
  const add=(r,x)=>{if(!r.trips.includes(x))r.trips.push(x)};
  for(const x of trips){
    let hit=false;
    // 1) 제목에 적힌 출장자 이름
    for(const n of (x.travelers||[])){
      let r=rows.find(r=>r.m&&normName(r.m.name)===normName(n));
      if(!r&&JC.btAll){r=rows.find(r=>!r.m&&r.key==='n:'+n);if(!r){r={name:n,m:null,key:'n:'+n,trips:[]};rows.push(r)}}
      if(r){add(r,x);hit=true}
    }
    // 2) 담당자 (제목에 이름이 없을 때)
    if(!(x.travelers||[]).length){
      let r=rows.find(r=>r.m&&x.personId&&jiraAcc(r.m)===x.personId)
        ||rows.find(r=>r.m&&normName(r.m.name)&&(normName(x.person).includes(normName(r.m.name))||normName(r.m.jiraName)===normName(x.person)));
      if(!r&&JC.btAll){r=rows.find(r=>!r.m&&r.key===(x.personId||x.person));if(!r){r={name:x.person||'(담당자 없음)',m:null,key:x.personId||x.person,trips:[]};rows.push(r)}}
      if(r){add(r,x);hit=true}
    }
  }
  let out=JC.btAll?rows:rows.filter(r=>r.m);
  if(ui.btOnly)out=out.filter(r=>r.trips.length);
  return out;
}

}

let modalCtx=null;
function opts(list,val,ph){return (ph!=null?`<option value="">${ph}</option>`:'')+list.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return `<option value="${esc(v)}" ${String(val??'')===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}
const siteOpts=()=>[...S.sites].sort(byName).map(s=>({v:s.id,l:(s.customer?s.customer+' · ':'')+s.name}));
const memOpts=()=>[...S.members].sort(byName).map(m=>({v:m.id,l:m.name}));
const eqOpts=site=>S.equips.filter(e=>!site||e.site===site).map(e=>({v:e.id,l:equipName(e.id)+(site?'':' · '+siteName(e.site))}));
function field(f,v){
  const req=f.req?'<em>*</em>':'',id='f_'+f.k;
  let inp;
  if(f.t==='select')inp=`<select id="${id}" name="${f.k}" ${f.req?'required':''}>${opts(f.o,v,f.ph)}</select>`;
  else if(f.t==='area')inp=`<textarea id="${id}" name="${f.k}">${esc(v||'')}</textarea>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v??'')}" ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<div class="fld ${f.full?'full':''}"><label for="${id}">${f.l}${req}</label>${inp}</div>`;
}
function openModal(title,fields,data,col,extraHtml){
  modalCtx={col,id:data&&data.id,data:data||{},fields};
  $('#modalRoot').innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><form id="mform">${fields.map(f=>field(f,(data||{})[f.k])).join('')}${extraHtml||''}
  <div class="mact">${data&&data.id&&canWrite?'<button type="button" class="btn danger" data-act="del">삭제</button>':''}<span class="sp"></span><button type="button" class="btn" data-act="close">취소</button>${canWrite?'<button type="submit" class="btn pri">저장</button>':''}</div></form></div></div>`;
  const first=$('#mform input,#mform select');if(first)first.focus();
}
function closeModal(){$('#modalRoot').innerHTML='';modalCtx=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalCtx)closeModal()});
document.addEventListener('submit',async e=>{
  if(e.target.id==='jform'||e.target.id==='btform'){e.preventDefault();return}
  if(e.target.id!=='mform')return;e.preventDefault();
  const fd_=new FormData(e.target),o=Object.assign({},strip(modalCtx.data));
  for(const f of modalCtx.fields){let v=fd_.get(f.k);if(f.t==='number')v=v===''?null:Number(v);o[f.k]=v==null?'':v}
  if(modalCtx.col==='equips'){o.items=readItems();if(!o.status)o.status='대기'}
  if(modalCtx.col==='members'){o.jira=String(o.jira||'').trim();if(o.jira!==modalCtx.data.jira){delete o.jiraId;delete o.jiraSrc;delete o.jiraName}}
  if(modalCtx.col==='schedules'&&o.end&&o.end<o.start){toast('종료일이 시작일보다 빠릅니다');return}
  if(modalCtx.col==='troubles'){
    if(!modalCtx.id)o.no=S.troubles.reduce((m,x)=>Math.max(m,x.no||0),0)+1;
    if(o.status==='완료'&&!o.closed)o.closed=fd(today());
  }
  o.updated=new Date().toISOString();
  const btn=e.target.querySelector('[type=submit]');if(btn){btn.disabled=true;btn.textContent='저장 중…'}
  if(await save(modalCtx.col,modalCtx.id,o)){closeModal();toast('저장했습니다')}else if(btn){btn.disabled=false;btn.textContent='저장'}
});
function itemsHtml(items){
  return `<div class="items"><label style="font-size:12px;color:var(--muted);font-weight:500">셋업 체크 항목 (완료 · 항목명 · 시작 · 종료)</label><div id="itemList">${items.map(itemRow).join('')}</div><div style="display:flex;gap:6px"><button type="button" class="btn sm" data-act="addItem">+ 항목 추가</button><button type="button" class="btn sm" data-act="fillDates">시작일부터 2일씩 자동 배정</button></div></div>`;
}
function itemRow(i){return `<div class="irow" data-iid="${esc(i.id)}"><input type="checkbox" class="i-done" ${i.done?'checked':''} aria-label="완료"><input type="text" class="i-name" value="${esc(i.name)}" aria-label="항목명"><input type="date" class="i-s" value="${esc(i.start||'')}" aria-label="시작"><input type="date" class="i-e" value="${esc(i.end||'')}" aria-label="종료"><button type="button" class="x" data-act="rmItem" aria-label="항목 삭제">×</button></div>`}
function readItems(){return [...document.querySelectorAll('#itemList .irow')].map(r=>({id:r.dataset.iid,name:r.querySelector('.i-name').value.trim(),start:r.querySelector('.i-s').value,end:r.querySelector('.i-e').value,done:r.querySelector('.i-done').checked})).filter(i=>i.name)}

const F={

  tr:()=>[{k:'date',l:'발생일',t:'date',req:1},{k:'status',l:'상태',t:'select',o:TR_STATUS},{k:'site',l:'사이트',t:'select',o:siteOpts(),req:1,ph:'선택'},{k:'equip',l:'설비',t:'select',o:eqOpts(),ph:'(없음)'},{k:'cat',l:'구분',t:'select',o:TR_CAT},{k:'pri',l:'우선순위',t:'select',o:TR_PRI},{k:'owner',l:'담당자',t:'select',o:memOpts(),ph:'선택'},{k:'closed',l:'조치 완료일',t:'date'},{k:'title',l:'제목',req:1,full:1},{k:'symptom',l:'현상',t:'area',full:1},{k:'cause',l:'원인',t:'area',full:1},{k:'action',l:'조치 내용',t:'area',full:1}]
};

// ---------- actions ----------
let armT=null;
async function act(a,d,ev,el){
  const get=(c,id)=>S[c].find(x=>x.id===id);
  switch(a){
    case 'zoom':ui[d.k]=d.v;render();break;
    case 'shift':{const k=d.k,z=ZOOM[ui[d.z]];if(d.d==='0'){ui[k]=null}else ui[k]=addD(tlStart(k),Number(d.d)*z.step*(ui[d.z]==='week'?1:1));render();break}
    case 'toggleEq':ui.open[d.id]=!ui.open[d.id];render();break;
    case 'expandAll':S.equips.forEach(e=>ui.open[e.id]=true);render();break;
    case 'collapseAll':ui.open={};render();break;
    case 'gDone':ui.gDone=el.checked;render();break;
    case 'prDone':ui.prDone=el.checked;render();break;
    case 'toggleItem':case 'chkItem':{
      if(!canWrite)return;
      const e=get('equips',d.id);if(!e)return;
      const items=(e.items||[]).map(i=>i.id===d.sub?Object.assign({},i,{done:!i.done}):i);
      const o=strip(e);o.items=items;if(items.length&&items.every(i=>i.done))o.status='완료';else if(items.some(i=>i.done)&&o.status==='대기')o.status='진행';
      await save('equips',e.id,o);break}
    case 'newSite':openModal('사이트 등록',F.site,null,'sites');break;
    case 'editSite':openModal('사이트 수정',F.site,get('sites',d.id),'sites');break;
    case 'newMem':openModal('인원 등록',F.mem,null,'members');break;
    case 'editMem':openModal('인원 수정',F.mem,get('members',d.id),'members');break;
    case 'newEq':{if(!S.sites.length){toast('사이트를 먼저 등록하세요');return}
      openModal('설비 셋업 등록',F.eq(),{status:'진행'},'equips',itemsHtml(DEFAULT_ITEMS.map(n=>({id:uid(),name:n}))));break}
    case 'editEq':{const e=get('equips',d.id);if(e)openModal('설비 셋업 수정',F.eq(),e,'equips',itemsHtml(e.items||[]));break}
    case 'addItem':$('#itemList').insertAdjacentHTML('beforeend',itemRow({id:uid(),name:''}));$('#itemList .irow:last-child .i-name').focus();break;
    case 'rmItem':el.closest('.irow').remove();break;
    case 'fillDates':{const rows=[...document.querySelectorAll('#itemList .irow')];const first=rows.find(r=>r.querySelector('.i-s').value);let d0=first?pd(first.querySelector('.i-s').value):today();
      for(const r of rows){r.querySelector('.i-s').value=fd(d0);r.querySelector('.i-e').value=fd(addD(d0,1));d0=addD(d0,2)}toast('첫 시작일 기준으로 2일씩 배정했습니다');break}
    case 'newSch':openModal('일정 등록',F.sch(),{type:'셋업',start:fd(today())},'schedules');break;
    case 'editSch':openModal('일정 수정',F.sch(),get('schedules',d.id),'schedules');break;
    case 'newTr':openModal('트러블 등록',F.tr(),{date:fd(today()),status:'접수',pri:'중',cat:'HW'},'troubles');break;
    case 'newTrFor':{const e=get('equips',d.id);openModal('트러블 등록',F.tr(),{date:fd(today()),status:'접수',pri:'중',cat:'HW',site:e.site,equip:e.id,owner:e.owner},'troubles');break}
    case 'editTr':{const t=get('troubles',d.id);if(t)openModal(`트러블 #${t.no||''} 수정`,F.tr(),t,'troubles');break}
    case 'close':closeModal();break;
    case 'scrim':if(ev.target===el)closeModal();break;
    case 'del':{

// ---------- Jira 출장 일정 (BT 프로젝트) ----------
const BT={state:'init',trips:[],at:null,err:null,busy:false,timer:null,key:'',fields:null};
function cfRef(id){const m=/^customfield_(\d+)$/.exec(id||'');return m?`cf[${m[1]}]`:id}
function btJql(){
  if(String(JC.btJql||'').trim())return String(JC.btJql).trim();
  const p=String(JC.btProject||'BT').trim().replace(/"/g,'');
  if(!JC.btStart)return null;
  const S_=cfRef(JC.btStart),E_=cfRef(JC.btEnd||JC.btStart),from=fd(addD(today(),-200));
  // 기준정보 인원만: 계정이 확인된 인원은 Jira에서 바로 걸러 받음 (이름만 있는 인원은 화면에서 이름으로 매칭)
  let who='';
  if(!JC.btAll){
    const ids=S.members.map(jiraAcc).filter(Boolean);
    const unresolved=S.members.some(m=>!jiraAcc(m));
    const names=S.members.map(m=>String(m.name||'').trim()).filter(n=>n.length>=2).map(n=>`summary ~ "${n.replace(/"/g,'')}"`);
    const conds=(ids.length&&!unresolved?[`${JC.btPerson==='reporter'?'reporter':'assignee'} in (${ids.map(i=>'"'+i+'"').join(',')})`]:[]).concat(names);
    if(conds.length&&(ids.length&&!unresolved||names.length))who=` AND (${conds.join(' OR ')})`;
  }
  const dateCond=JC.btEnd&&JC.btEnd!==JC.btStart?`(${E_} >= "${from}" OR ${S_} >= "${from}")`:`${S_} >= "${from}"`;
  return `project = "${p}"${who} AND ${dateCond} ORDER BY ${S_} DESC`;
}
// BT 제목 형식: 최초/2026-10-19(월)~2026-10-23(금)/구미/LGIT/맹준영,한민철
const BT_RANGE=/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})(\s*\([^)]*\))?\s*[~∼～]\s*(?:(\d{4})[-.\/])?(\d{1,2})[-.\/](\d{1,2})(\s*\([^)]*\))?/;
const p2=n=>String(n).padStart(2,'0');
function parseBTTitle(t){
  const out={};const m=BT_RANGE.exec(t||'');
  if(m){out.start=`${m[1]}-${p2(m[2])}-${p2(m[3])}`;out.end=`${m[5]||m[1]}-${p2(m[6])}-${p2(m[7])}`;if(out.end<out.start&&!m[5])out.end=`${+m[1]+1}-${p2(m[6])}-${p2(m[7])}`}
  const parts=String(t||'').split('/').map(x=>x.trim());
  let i=parts.findIndex(x=>BT_RANGE.test(x)||/\d{4}-\d{1,2}-\d{1,2}/.test(x));
  if(i>=0){
    const rest=parts.slice(i+1);
    const names=[];const place=[];
    rest.forEach((x,j)=>{const toks=x.split(/[,，、·\s]+/).filter(Boolean);
      if(j>=rest.length-1||toks.every(k=>/^[가-힣]{2,4}$/.test(k))&&toks.length>1)toks.forEach(k=>{if(/^[가-힣A-Za-z]{2,10}$/.test(k))names.push(k)});else place.push(x)});
    out.place=place.filter(Boolean).reverse().join(' ');out.names=names;
  }
  return out;
}
function enrichTrip(x){
  const t=parseBTTitle(x.summary);
  const endFieldSet=!!(JC.btEnd&&JC.btEnd!==JC.btStart);
  if(!x.start&&t.start)x.start=t.start;
  if(t.end&&(!endFieldSet||!x.end)){x.end=t.end;x.endFromTitle=true}
  if(!x.site&&t.place)x.site=t.place;
  x.travelers=t.names||[];x.titleRange=!!t.start;
  return x;
}
function btEnsure(force){
  if(dbState!=='on'||!JC._loaded)return;
  const q=btJql();
  if(!q){clearInterval(BT.timer);BT.key='';BT.state='nocfg';render();return}
  if(q===BT.key&&!force)return;
  BT.key=q;clearInterval(BT.timer);if(BT.state!=='ok')BT.state='loading';
  btFetch();BT.timer=setInterval(()=>{if(!document.hidden)btFetch()},300000);
}
async function btFetch(){
  if(!BT.key)return;BT.busy=true;render();
  try{const j=await api('jiraTrips',{jql:BT.key,start:JC.btStart,end:JC.btEnd||JC.btStart,site:JC.btSite||'',person:JC.btPerson||'assignee'});
    if(j.site)J.site=j.site;
    BT.trips=(j.trips||[]).map(x=>enrichTrip(Object.assign(x,{jira:true})));BT.state='ok';BT.err=null;BT.at=Date.now()}
  catch(e){if(BT.state==='ok'&&!/^jira_(config|http|auth)$/.test(e.code))BT.err=e;else{BT.state='error';BT.err=e;BT.trips=[]}}
  BT.busy=false;render();
}
function btStatus(){
  if(BT.state==='nocfg')return `<span class="pill warn">Jira 출장 설정 필요</span><button class="btn sm" data-tab="admin">설정</button>`;
  if(BT.state==='loading'||BT.state==='init')return `<span class="muted" style="font-size:12px">Jira 출장 불러오는 중…</span>`;
  if(BT.state==='error')return `<span class="pill bad" title="${esc(BT.err&&BT.err.message||'')}">${BT.err&&BT.err.code==='jira_auth'?'Jira 로그인 실패 (API 토큰 확인)':'Jira 출장 불러오기 실패'}</span><button class="btn sm" data-act="btRefresh">다시 시도</button>`;
  return `<span class="jstamp">BT ${BT.trips.length}건 · ${BT.at?hhmm(BT.at):''} 갱신</span><button class="btn sm" data-act="btRefresh" ${BT.busy?'disabled':''}>${BT.busy?'…':'새로 고침'}</button><label class="muted" style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="pBtOnly" data-act="pBtOnly" ${ui.btOnly?'checked':''}>출장 있는 인원만</label>`;
}
function vBtAdmin(){
  const c=JC,f=BT.fields;
  const opt=(cur,filter)=>{
    let list=f?f.filter(filter):[];
    if(cur&&!list.some(x=>x.id===cur))list=[{id:cur,name:cur}].concat(list);
    return `<option value="">(선택)</option>`+list.map(x=>`<option value="${esc(x.id)}" ${x.id===cur?'selected':''}>${esc(x.name)}${x.sample?' · 예: '+esc(x.sample):''}</option>`).join('');
  };
  const isDate=x=>x.date,isText=x=>!x.date;
  return `<div class="panel"><h2>Jira 출장 일정 (BT 보드)<span class="sp"></span><span class="muted" style="font-weight:400;font-size:12px">인원 스케쥴에 BT 보드 담당자별 출장이 표시됩니다</span></h2><div class="body">
  <div class="modal" style="width:auto;box-shadow:none;border:0"><form id="btform" style="padding:0">
    <div class="fld"><label for="bt_proj">프로젝트 키</label><input id="bt_proj" type="text" value="${esc(c.btProject||'BT')}"></div>
    <div class="fld"><label>&nbsp;</label><button type="button" class="btn" data-act="btFields">${BT.fieldsBusy?'불러오는 중…':'BT 필드 불러오기'}</button></div>
    <div class="fld"><label for="bt_start">출장 시작일 필드</label><select id="bt_start">${opt(c.btStart,isDate)}</select></div>
    <div class="fld"><label for="bt_end">출장 종료일 필드</label><select id="bt_end">${opt(c.btEnd,isDate)}</select></div>
    <div class="fld"><label for="bt_site">출장지(고객사) 필드 (선택)</label><select id="bt_site">${opt(c.btSite,isText)}</select></div>
    <div class="fld"><label for="bt_person">이름 기준</label><select id="bt_person">${opts([{v:'assignee',l:'담당자 (Assignee)'},{v:'reporter',l:'보고자 (Reporter)'}],c.btPerson||'assignee')}</select></div>
    <div class="fld full"><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg)"><input type="checkbox" id="bt_all" ${c.btAll?'checked':''}>BT 보드의 모든 출장자 표시 (해제하면 기준정보에 등록한 인원만)</label></div>
    <div class="fld full"><label for="bt_jql">JQL 직접 입력 (선택)</label><input id="bt_jql" type="text" placeholder="비워 두면: 프로젝트 BT 중 최근 200일 이후 출장 (최신순 최대 500건)" value="${esc(c.btJql||'')}"></div>
    ${f===null?'<div class="fld full muted" style="font-size:12px">[BT 필드 불러오기]를 누르면 BT 이슈에서 날짜 필드를 찾아 자동으로 골라 줍니다.</div>':''}
    <div class="mact"><span class="sp"></span><button type="button" class="btn pri" data-act="btSave">저장</button></div>
  </form></div></div></div>`;
}
async function btAct(a,d,el){
  if(a==='btRefresh'){if(!BT.key)btEnsure(true);else btFetch();return}
  if(a==='pJira'){ui.showJira=el.checked;render();return}
  if(a==='pBtOnly'){ui.btOnly=el.checked;render();return}
  if(a==='jOpenIssue'){const base=(J.site||'https://do-intekplus.atlassian.net').replace(/\/+$/,'');window.open(base+'/browse/'+encodeURIComponent(d.id),'_blank','noopener');return}
  if(a==='btFields'){
    const proj=($('#bt_proj').value||'BT').trim();BT.fieldsBusy=true;render();
    try{const j=await api('jiraFields',{project:proj});BT.fields=j.fields||[];
      // 자동 추천
      const pick=(re)=>(BT.fields.find(x=>x.date&&re.test(x.name))||{}).id;
      if(!JC.btStart)JC.btStart=pick(/출장.*시작|시작.*일|start/i)||'';
      if(!JC.btEnd)JC.btEnd=pick(/출장.*종료|종료.*일|복귀|end|due|기한/i)||'';
      if(!JC.btSite)JC.btSite=(BT.fields.find(x=>!x.date&&/출장지|방문|고객|사이트|site|location|장소/i.test(x.name))||{}).id||'';
      toast(`필드 ${BT.fields.length}개를 불러왔습니다. 선택을 확인하고 저장하세요`)}
    catch(e){toast(e.code==='jira_config'?'Apps Script에 Jira 연결 정보를 먼저 넣어 주세요':'불러오지 못했습니다: '+(e.message||''))}
    BT.fieldsBusy=false;render();return}
  if(a==='btSave'){
    const v=id=>($('#'+id)||{}).value||'';
    const o=Object.assign(strip(JC),{btProject:v('bt_proj').trim()||'BT',btStart:v('bt_start'),btEnd:v('bt_end'),btSite:v('bt_site'),btPerson:v('bt_person')||'assignee',btAll:!!($('#bt_all')||{}).checked,btJql:v('bt_jql').trim(),updated:new Date().toISOString()});
    delete o._loaded;
    if(!o.btStart&&!o.btJql){toast('출장 시작일 필드를 골라 주세요');return}
    if(await saveConfig(o)){toast('출장 일정 설정을 저장했습니다');BT.key='';btEnsure(true)}
    return}
}

// ---------- Jira 출장 일정 수정 ----------
function btEditOpen(key){
  const x=BT.trips.find(t=>t.key===key);if(!x)return;
  const hasEndField=!!(JC.btEnd&&JC.btEnd!==JC.btStart);
  const canEnd=hasEndField||x.titleRange;
  const base=(J.site||'https://do-intekplus.atlassian.net').replace(/\/+$/,'');
  modalCtx={col:'__bt',data:{key},fields:[]};
  $('#modalRoot').innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="출장 일정 수정"><h3>출장 일정 수정 <span class="muted mono" style="font-weight:400;font-size:12px">${esc(x.key)}</span></h3><form id="btEditForm">
    <div class="fld full"><label>제목</label><div><b>${esc(x.summary)}</b></div></div>
    <div class="fld"><label>출장자</label><div>${esc((x.travelers&&x.travelers.length?x.travelers.join(', '):x.person)||'(없음)')}${x.person&&x.travelers&&x.travelers.length?` <span class="muted" style="font-size:12px">(담당 ${esc(x.person)})</span>`:''}</div></div>
    <div class="fld"><label>상태 · 출장지</label><div>${esc(x.status)}${x.site?' · '+esc(x.site):''}</div></div>
    <div class="fld"><label for="bt_e_s">출장 시작일<em>*</em></label><input id="bt_e_s" type="date" required value="${esc(x.start||'')}"></div>
    <div class="fld"><label for="bt_e_e">출장 종료일</label><input id="bt_e_e" type="date" value="${esc(x.end||'')}" ${canEnd?'':'disabled'}></div>
    <div class="fld full muted" style="font-size:12px">${x.titleRange?'저장하면 출장 시작일 필드와 함께 <b>제목 속 날짜</b>도 새 날짜로 바뀝니다.':''}${!canEnd?'종료일 정보가 없어 시작일만 바꿀 수 있습니다.':''} Jira ${esc(x.key)} 이슈에 바로 반영됩니다. (Apps Script에 등록한 Jira 계정 권한으로 수정)</div>
    <div id="btEditMsg" class="fld full" style="font-size:13px"></div>
    <div class="mact"><a class="btn" href="${esc(base)}/browse/${encodeURIComponent(x.key)}" target="_blank" rel="noopener">Jira에서 열기 ↗</a><span class="sp"></span><button type="button" class="btn" data-act="close">닫기</button><button type="submit" class="btn pri">Jira에 저장</button></div>
  </form></div></div>`;
}
function dowK(iso){const d=pd(iso);return d?DOW[d.getDay()]:''}
function newTitle(title,s,e){return String(title).replace(BT_RANGE,`${s}(${dowK(s)})~${e}(${dowK(e)})`)}
function withTime(date,raw){return raw&&raw.length>10?date+raw.slice(10):date}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='btEditForm')return;e.preventDefault();
  const key=modalCtx&&modalCtx.data.key,x=BT.trips.find(t=>t.key===key);if(!x)return;
  const s=$('#bt_e_s').value,en=$('#bt_e_e').value,msg=$('#btEditMsg');
  const hasEnd=!!(JC.btEnd&&JC.btEnd!==JC.btStart);
  const canEnd=hasEnd||x.titleRange;
  if(!s){msg.innerHTML='<span class="pill bad">확인 필요</span> 시작일을 입력해 주세요.';return}
  if(canEnd&&en&&en<s){msg.innerHTML='<span class="pill bad">확인 필요</span> 종료일이 시작일보다 빠릅니다.';return}
  const fields={};
  if(s!==x.start)fields[JC.btStart]=withTime(s,x.startRaw);
  if(hasEnd&&en!==x.end)fields[JC.btEnd]=en?withTime(en,x.endRaw):'';
  if(x.titleRange&&(s!==x.start||(en||s)!==x.end)){const nt=newTitle(x.summary,s,en||s);if(nt!==x.summary)fields.summary=nt}
  if(!Object.keys(fields).length){closeModal();return}
  const btn=e.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='저장 중…';
  try{
    await api('jiraUpdateTrip',{key,fields});
    x.start=s;if(canEnd)x.end=en||s;if(fields.summary)x.summary=fields.summary;closeModal();render();toast(`${key} 출장 일정을 Jira에 저장했습니다`);btFetch();
  }catch(err){
    btn.disabled=false;btn.textContent='Jira에 저장';
    const m=String(err&&err.message||'');
    msg.innerHTML='<span class="pill bad">저장 실패</span> '+(/HTTP 40[13]/.test(m)?'이 이슈를 수정할 Jira 권한이 없습니다. Jira에서 직접 수정하거나 이슈 수정 권한을 요청하세요.':/HTTP 400/.test(m)?'Jira가 날짜 형식이나 필드를 거절했습니다: '+esc(m):esc(m||'네트워크 오류'));
  }
});

render();
initDb();

})();
</script>
